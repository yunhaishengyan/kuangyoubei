<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1410">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>况友杯 · 赛程管理</title>
<meta name="description" content="足球联赛报名名单、球队、抽签、瑞士轮、淘汰赛和比分管理，离线可用。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9A%BD%3C/text%3E%3C/svg%3E">
<style>
/* ============ 基础 ============ */
:root {
  --bg: #070f0c;
  --bg-2: #0b1611;
  --card: #111e18;
  --card-2: #16261f;
  --line: #22372c;
  --line-soft: rgba(46, 230, 107, .1);
  --text: #e9f5ee;
  --muted: #8aa79a;
  --muted-2: #63806f;
  --green: #2ee66b;
  --green-deep: #12a04a;
  --gold: #f5c451;
  --red: #ff6b6b;
  --blue: #4cc9f0;
  --radius: 18px;
  --shadow: 0 10px 30px rgba(0, 0, 0, .35);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

body {
  min-height: 100vh;
  background:
    radial-gradient(1100px 560px at 8% -12%, rgba(18, 90, 52, .55) 0%, transparent 58%),
    radial-gradient(900px 480px at 108% 4%, rgba(12, 78, 96, .4) 0%, transparent 55%),
    var(--bg);
  background-attachment: fixed;
}

h1, h2, h3, h4 { margin: 0; font-weight: 700; letter-spacing: .2px; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
ol, ul { margin: 0; padding: 0; list-style: none; }
a { color: var(--green); }

.app {
  max-width: 760px;
  margin: 0 auto;
  padding: 0 14px calc(40px + env(safe-area-inset-bottom));
}

/* ============ 顶栏 ============ */
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 2px 10px;
  background: linear-gradient(180deg, rgba(7, 15, 12, .96) 60%, rgba(7, 15, 12, 0));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

.brand { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }

.ball {
  display: grid;
  place-items: center;
  width: 42px;
  height: 42px;
  flex: none;
  border-radius: 14px;
  font-size: 22px;
  background: linear-gradient(145deg, #1d3b2c, #0f241a);
  border: 1px solid rgba(46, 230, 107, .28);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), 0 6px 18px rgba(0, 0, 0, .3);
}

.brand-text { min-width: 0; }
.brand-text h1 {
  font-size: 19px;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.brand-text p {
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.icon-btn {
  width: 40px;
  height: 40px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 13px;
  font-size: 18px;
  color: var(--muted);
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--line);
}
.icon-btn:active { background: rgba(255, 255, 255, .09); }

/* ============ 阶段进度 ============ */
.stagebar {
  display: flex;
  gap: 5px;
  padding: 2px 0 10px;
}
.stagebar .seg {
  height: 4px;
  flex: 1;
  border-radius: 3px;
  background: #1b2b23;
  overflow: hidden;
  position: relative;
}
.stagebar .seg.done { background: linear-gradient(90deg, #1f9c50, var(--green)); }
.stagebar .seg.current {
  background: linear-gradient(90deg, #1f9c50, var(--green));
  box-shadow: 0 0 12px rgba(46, 230, 107, .5);
}

/* ============ 标签栏 ============ */
.tabs {
  position: sticky;
  top: 66px;
  z-index: 25;
  display: flex;
  gap: 6px;
  padding: 6px 0 12px;
  overflow-x: auto;
  scrollbar-width: none;
  background: linear-gradient(180deg, rgba(7, 15, 12, .97) 70%, rgba(7, 15, 12, 0));
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.tabs::-webkit-scrollbar { display: none; }

.tab {
  flex: none;
  padding: 8px 14px;
  border-radius: 999px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--muted);
  background: rgba(255, 255, 255, .045);
  border: 1px solid transparent;
  transition: all .18s ease;
}
.tab .cnt {
  font-size: 10.5px;
  margin-left: 4px;
  opacity: .65;
  font-weight: 700;
}
.tab.active {
  color: #04150b;
  background: linear-gradient(135deg, var(--green), #19c45a);
  box-shadow: 0 6px 18px rgba(46, 230, 107, .28);
}

/* ============ 通用 ============ */
.view { padding-bottom: 10px; animation: fade .22s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

.card {
  background: linear-gradient(180deg, rgba(24, 40, 32, .95), rgba(15, 26, 21, .95));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.section { margin-top: 16px; }
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin: 0 2px 9px;
}
.section-head h3 { font-size: 15px; }
.section-head .sub { font-size: 12px; color: var(--muted); }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 13px;
  font-size: 14px;
  font-weight: 700;
  color: var(--text);
  background: rgba(255, 255, 255, .06);
  border: 1px solid var(--line);
  transition: transform .12s ease, filter .18s ease;
  white-space: nowrap;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .42; pointer-events: none; }
.btn-primary {
  color: #04150b;
  background: linear-gradient(135deg, #35ef75, #13a54b);
  border-color: transparent;
  box-shadow: 0 8px 22px rgba(46, 230, 107, .26);
}
.btn-danger { color: #ffb4b4; background: rgba(255, 107, 107, .1); border-color: rgba(255, 107, 107, .3); }
.btn-sm { padding: 7px 11px; font-size: 12.5px; border-radius: 10px; }
.btn-block { width: 100%; }

.row { display: flex; gap: 9px; align-items: center; }
.row.wrap { flex-wrap: wrap; }
.row.gap { margin-top: 10px; }
.spacer { flex: 1; }

.hint { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.muted { color: var(--muted); }
.tiny { font-size: 11.5px; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  background: rgba(255, 255, 255, .07);
  color: var(--muted);
}
.badge.green { background: rgba(46, 230, 107, .14); color: var(--green); }
.badge.gold { background: rgba(245, 196, 81, .14); color: var(--gold); }
.badge.red { background: rgba(255, 107, 107, .13); color: var(--red); }

.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

/* ============ 总览 ============ */
.hero {
  position: relative;
  overflow: hidden;
  padding: 20px 18px 18px;
  border-radius: 22px;
  border: 1px solid rgba(46, 230, 107, .18);
  background:
    radial-gradient(420px 180px at 100% 0%, rgba(46, 230, 107, .17), transparent 70%),
    linear-gradient(160deg, #16281f, #0c1712);
  box-shadow: var(--shadow);
  margin-top: 4px;
}
.hero::after {
  content: "";
  position: absolute;
  right: -46px;
  bottom: -60px;
  width: 190px;
  height: 190px;
  border-radius: 50%;
  border: 1px solid rgba(46, 230, 107, .14);
  pointer-events: none;
}
.hero .eyebrow {
  display: inline-block;
  font-size: 11px;
  letter-spacing: 1.4px;
  color: var(--green);
  font-weight: 800;
  margin-bottom: 7px;
  text-transform: uppercase;
}
.hero h2 { font-size: 21px; line-height: 1.35; margin-bottom: 6px; }
.hero p { color: var(--muted); font-size: 13px; max-width: 34em; }
.hero .btn { margin-top: 15px; }

.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
  margin-top: 14px;
}
.metric {
  padding: 12px 6px 10px;
  border-radius: 15px;
  text-align: center;
  background: rgba(255, 255, 255, .035);
  border: 1px solid var(--line-soft);
}
.metric b { display: block; font-size: 19px; line-height: 1.2; letter-spacing: -.4px; }
.metric span { display: block; font-size: 10.5px; color: var(--muted); margin-top: 3px; }

.quick-list { display: grid; gap: 7px; }
.quick-match {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px;
  padding: 11px 13px;
  border-radius: 13px;
  background: rgba(255, 255, 255, .035);
  border: 1px solid var(--line-soft);
  font-size: 13px;
}
.quick-match .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.quick-match .t.r { text-align: right; }
.quick-match .s {
  font-weight: 800;
  font-size: 14px;
  color: var(--green);
  min-width: 54px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}
.quick-match .s.pending { color: var(--muted-2); font-weight: 600; font-size: 11px; }

/* ============ 通用空状态 ============ */
.empty {
  text-align: center;
  padding: 34px 20px;
  border-radius: var(--radius);
  border: 1px dashed #2a4236;
  background: rgba(255, 255, 255, .02);
  margin-top: 8px;
}
.empty .em {
  font-size: 34px;
  display: block;
  margin-bottom: 10px;
  filter: grayscale(.15);
}
.empty h3 { font-size: 16px; margin-bottom: 6px; }
.empty p { color: var(--muted); font-size: 13px; max-width: 30em; margin: 0 auto 14px; }
.empty .row { justify-content: center; flex-wrap: wrap; }

/* ============ 名单 ============ */
.search {
  width: 100%;
  margin-top: 12px;
  padding: 11px 14px;
  border-radius: 13px;
  background: rgba(255, 255, 255, .04);
  border: 1px solid var(--line);
  outline: none;
  font-size: 14px;
}
.search:focus { border-color: rgba(46, 230, 107, .45); }

.team-group { margin-top: 14px; }
.team-group-head {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 3px 7px;
}
.team-group-head b { font-size: 14px; }
.team-group-head .n { font-size: 11.5px; color: var(--muted); }

.roster-card {
  border-radius: 15px;
  border: 1px solid var(--line);
  background: var(--card);
  overflow: hidden;
}
.prow {
  display: flex;
  align-items: center;
  gap: 11px;
  width: 100%;
  padding: 10px 13px;
  text-align: left;
  border-bottom: 1px solid rgba(34, 55, 44, .55);
}
.prow:last-child { border-bottom: none; }
.prow:active { background: rgba(255, 255, 255, .04); }
.pno {
  width: 29px;
  height: 29px;
  flex: none;
  display: grid;
  place-items: center;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 800;
  color: var(--muted);
  background: rgba(255, 255, 255, .05);
  font-variant-numeric: tabular-nums;
}
.pname { flex: 1; min-width: 0; font-size: 14px; }
.pname em {
  font-style: normal;
  font-size: 11px;
  color: var(--muted);
  margin-left: 7px;
  padding: 1px 6px;
  border-radius: 6px;
  background: rgba(255, 255, 255, .05);
}
.pmeta { font-size: 11.5px; color: var(--muted-2); }
.prow .chev { color: var(--muted-2); font-size: 16px; }
.prow.hidden { display: none; }

/* ============ 球队 ============ */
.team-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-top: 10px; }
@media (max-width: 360px) { .team-grid { grid-template-columns: 1fr; } }

.team-card {
  position: relative;
  padding: 13px 13px 11px;
  border-radius: 16px;
  background: linear-gradient(180deg, rgba(24, 40, 32, .95), rgba(14, 24, 19, .95));
  border: 1px solid var(--line);
  overflow: hidden;
}
.team-card::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 3px;
  background: var(--tc, var(--green));
}
.team-card .tc-head { display: flex; align-items: center; gap: 7px; min-width: 0; }
.team-card .tc-name {
  font-size: 14px;
  font-weight: 700;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.team-card .tc-sub { font-size: 11.5px; color: var(--muted); margin: 5px 0 8px; }
.team-card .tc-players {
  display: flex;
  gap: 4px;
  flex-wrap: nowrap;
  overflow: hidden;
  margin-bottom: 9px;
}
.avatar {
  width: 25px;
  height: 25px;
  border-radius: 9px;
  flex: none;
  display: grid;
  place-items: center;
  font-size: 10.5px;
  font-weight: 700;
  color: #06150d;
  background: var(--tc, #2ee66b);
  opacity: .9;
}
.team-card .tc-actions { display: flex; gap: 6px; }
.team-card .tc-actions .btn { flex: 1; padding: 6px 4px; font-size: 11.5px; }

/* ============ 抽签 ============ */
.draw-stage {
  padding: 22px 16px;
  border-radius: 20px;
  text-align: center;
  border: 1px solid rgba(46, 230, 107, .16);
  background:
    radial-gradient(300px 160px at 50% 0%, rgba(46, 230, 107, .16), transparent 70%),
    linear-gradient(180deg, #14241c, #0c1712);
  margin-top: 6px;
}
.draw-stage .big-ball {
  font-size: 44px;
  display: block;
  margin-bottom: 10px;
  animation: float 3s ease-in-out infinite;
}
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.draw-stage h2 { font-size: 18px; }
.draw-stage p { color: var(--muted); font-size: 12.5px; margin-top: 5px; }
.draw-stage .btn { margin-top: 16px; }

.slots { display: grid; gap: 6px; margin-top: 12px; }
.slot {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 13px;
  border-radius: 12px;
  background: rgba(255, 255, 255, .035);
  border: 1px solid var(--line-soft);
  font-size: 13.5px;
}
.slot .no {
  width: 24px;
  flex: none;
  text-align: center;
  font-weight: 800;
  font-size: 12px;
  color: var(--muted-2);
  font-variant-numeric: tabular-nums;
}
.slot .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .vs-mark { font-size: 11px; color: var(--muted-2); }

/* 抽签动画 */
.draw-anim { padding: 26px 16px; text-align: center; }
.draw-anim .rolling {
  font-size: 24px;
  font-weight: 800;
  min-height: 42px;
  letter-spacing: 1px;
  color: var(--green);
  text-shadow: 0 0 24px rgba(46, 230, 107, .4);
}
.draw-anim p { color: var(--muted); font-size: 12.5px; margin-top: 8px; }

/* ============ 比赛卡片 ============ */
.round-chips { display: flex; gap: 6px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.round-chips::-webkit-scrollbar { display: none; }
.round-chip {
  flex: none;
  padding: 7px 13px;
  border-radius: 10px;
  font-size: 12.5px;
  font-weight: 700;
  color: var(--muted);
  background: rgba(255, 255, 255, .045);
  border: 1px solid transparent;
}
.round-chip.active { color: var(--green); background: rgba(46, 230, 107, .1); border-color: rgba(46, 230, 107, .3); }
.round-chip .ok { color: var(--green); margin-left: 3px; }

.matches { display: grid; gap: 8px; }
.match {
  padding: 11px 13px 10px;
  border-radius: 15px;
  background: var(--card);
  border: 1px solid var(--line);
}
.match.played { border-color: rgba(46, 230, 107, .22); }
.match-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 10.5px;
  color: var(--muted-2);
  margin-bottom: 6px;
  letter-spacing: .3px;
}
.match.bye { opacity: .72; }
.match .side {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 3px 0;
}
.match .side .nm {
  flex: 1;
  min-width: 0;
  font-size: 14px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.match.played .side.win .nm { color: var(--green); }
.match .side.lose .nm { color: var(--muted); }
.score {
  width: 46px;
  height: 38px;
  flex: none;
  text-align: center;
  font-size: 18px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  color: var(--text);
  background: #0a1510;
  border: 1px solid #2a4236;
  border-radius: 10px;
  outline: none;
  padding: 0;
}
.score:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(46, 230, 107, .14); }
.score::-webkit-outer-spin-button,
.score::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.score[type=number] { -moz-appearance: textfield; appearance: textfield; }
.score-static {
  width: 46px;
  flex: none;
  text-align: center;
  font-size: 18px;
  font-weight: 800;
  font-variant-numeric: tabular-nums;
}
.score-static.win { color: var(--green); }

.match-foot {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 7px;
  padding-top: 7px;
  border-top: 1px dashed rgba(34, 55, 44, .8);
}
.match-foot .hint { flex: 1; font-size: 11px; }
.match-foot .btn { padding: 7px 14px; font-size: 12.5px; }

/* ============ 积分榜 ============ */
.table-wrap { overflow-x: auto; border-radius: 15px; border: 1px solid var(--line); background: var(--card); }
table.standings { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 440px; }
table.standings th {
  font-size: 10.5px;
  font-weight: 700;
  color: var(--muted-2);
  text-align: center;
  padding: 9px 4px;
  border-bottom: 1px solid var(--line);
  letter-spacing: .4px;
  white-space: nowrap;
}
table.standings th:nth-child(2) { text-align: left; padding-left: 10px; }
table.standings td {
  padding: 9px 4px;
  text-align: center;
  border-bottom: 1px solid rgba(34, 55, 44, .45);
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
table.standings td:nth-child(2) { text-align: left; padding-left: 10px; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
table.standings tr:last-child td { border-bottom: none; }
table.standings tr.cut td { border-bottom: 2px dashed rgba(46, 230, 107, .35); }
table.standings tr.me td { background: rgba(46, 230, 107, .05); }
.rank-badge {
  display: inline-grid;
  place-items: center;
  width: 21px;
  height: 21px;
  border-radius: 7px;
  font-size: 10.5px;
  font-weight: 800;
  color: var(--muted);
  background: rgba(255, 255, 255, .05);
}
.rank-badge.top1 { color: #1a1403; background: var(--gold); }
.rank-badge.top2 { color: #10161a; background: #cfd8dc; }
.rank-badge.top3 { color: #1d1208; background: #d08a52; }
.team-cell { display: flex; align-items: center; gap: 7px; }
.team-cell span { overflow: hidden; text-overflow: ellipsis; }
.pts { color: var(--text); font-weight: 800; }

/* ============ 淘汰赛 ============ */
.bracket {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding: 4px 2px 12px;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.bracket::-webkit-scrollbar { display: none; }
.bracket-col { flex: none; width: 196px; display: flex; flex-direction: column; }
.bracket-col h4 {
  font-size: 11px;
  color: var(--muted);
  letter-spacing: 1px;
  margin-bottom: 9px;
  padding-left: 2px;
}
.bracket-col .col-body { display: flex; flex-direction: column; justify-content: space-around; flex: 1; gap: 10px; }
.ko-match {
  border-radius: 13px;
  background: var(--card);
  border: 1px solid var(--line);
  overflow: hidden;
  padding: 8px 10px;
  cursor: pointer;
}

<div class="app">

<script>
/* 足球联赛赛制引擎：报名导入、球队、抽签、瑞士轮、淘汰赛、积分榜 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.Engine = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var VERSION = 1;

    '#f472b6', '#eab308', '#6366f1', '#84cc16', '#f97316', '#06b6d4'];

  function uid(prefix) {
    return (prefix || 'id') + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }
  function nowISO() { return new Date().toISOString(); }
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }

  function keyOf(a, b) { return a < b ? a + '|' + b : b + '|' + a; }

  /* ---------------- 状态 ---------------- */

  function createState(opts) {
    opts = opts || {};
    return {
      v: VERSION,
      meta: {
        name: opts.name || '况友杯',
        season: opts.season || '',
        swissRounds: opts.swissRounds || 4,
        advance: opts.advance || 8,
        pointsWin: 3,
        pointsDraw: 1,
        pointsLoss: 0,
        createdAt: nowISO()
      },
      teams: [],
      players: [],
      draw: { done: false, order: [], at: null },

      ko: { built: false, rounds: [], champion: null, createdAt: null }

  function sanitizeState(raw) {
    if (!raw || typeof raw !== 'object') throw new Error('不是有效的比赛数据');

    var m = raw.meta || {};

    s.meta.season = norm(m.season);
    s.meta.swissRounds = Math.min(12, Math.max(1, int(m.swissRounds) || 4));
    s.meta.advance = [2, 4, 8, 16, 32].indexOf(int(m.advance)) >= 0 ? int(m.advance) : 8;
    s.meta.pointsWin = Math.max(0, num(m.pointsWin) || 3);
    s.meta.pointsDraw = Math.max(0, num(m.pointsDraw) || 1);
    if (Array.isArray(raw.teams)) {
      var seen = {};
      raw.teams.forEach(function (t) {
        if (!t || !norm(t.name) || seen[norm(t.name)]) return;
        seen[norm(t.name)] = 1;
        s.teams.push({
          id: String(t.id || uid('t')),
          name: norm(t.name),
          short: norm(t.short) || shortName(t.name),
          color: /^#[0-9a-fA-F]{3,8}$/.test(t.color || '') ? t.color : COLORS[s.teams.length % COLORS.length],

    }

    s.teams.forEach(function (t) { tmap[t.id] = t; });
    if (Array.isArray(raw.players)) {
      raw.players.forEach(function (p) {
        if (!p || !norm(p.name) || !tmap[p.teamId]) return;
        s.players.push({
          id: String(p.id || uid('p')),
          teamId: p.teamId,
          name: norm(p.name),
          no: p.no == null || p.no === '' ? '' : String(p.no).slice(0, 4),
          pos: norm(p.pos).slice(0, 12),

    }
    if (raw.draw && raw.draw.done) {
      var order = (raw.draw.order || []).filter(function (id) { return tmap[id]; });
      s.teams.forEach(function (t) { if (order.indexOf(t.id) < 0) order.push(t.id); });
      s.draw = { done: true, order: order, at: raw.draw.at || nowISO() };

    if (raw.swiss && Array.isArray(raw.swiss.rounds)) {
      raw.swiss.rounds.forEach(function (r, ri) {
        if (!r || !Array.isArray(r.matches) || !r.matches.length) return;
        var round = { no: ri + 1, matches: [] };
        r.matches.forEach(function (m) {
          if (!m || !tmap[m.homeId]) return;
          if (m.bye) {
            round.matches.push({ id: String(m.id || uid('m')), homeId: m.homeId, awayId: null, homeScore: null, awayScore: null, played: true, bye: true });
          } else if (tmap[m.awayId]) {
            round.matches.push({
              id: String(m.id || uid('m')), homeId: m.homeId, awayId: m.awayId,
              homeScore: m.homeScore == null ? null : int(m.homeScore),
              awayScore: m.awayScore == null ? null : int(m.awayScore),
              played: !!m.played, bye: false

          }

      });

      s.ko.order = (raw.ko.order || []).filter(function (id) { return tmap2[id]; });
      s.ko.rounds = raw.ko.rounds.map(function (r) {
        return {
          name: norm(r.name || ''),
          size: int(r.size) || 0,
          matches: (r.matches || []).map(function (m) {
            var a = m && tmap2[m.aId] ? m.aId : null;
            var b = m && tmap2[m.bId] ? m.bId : null;
            return {
              id: String((m && m.id) || uid('k')),
              aId: a, bId: b,
              aScore: m && m.aScore != null ? int(m.aScore) : null,
              bScore: m && m.bScore != null ? int(m.bScore) : null,
              aPens: m && m.aPens != null ? int(m.aPens) : null,
              bPens: m && m.bPens != null ? int(m.bPens) : null,

  function shortName(name) {

    if (n.length <= 4) return n;

  }

  /* ---------------- 报名表解析 ---------------- */

  var HEADER_PAT = /(队伍|队名|球队|所在队|代表队|team|club|姓名|名字|球员|队员|参赛者|name|player|号码|球衣|背号|编号|jersey|number|位置|场上位置|position|role|电话|手机|联系方式|联系电话|微信号|phone|mobile|tel|邮箱|email|备注|note)/i;

  function detectDelimiter(line) {
    if (line.indexOf('\t') >= 0) return '\t';
    var c = (line.match(/,/g) || []).length, sc = (line.match(/;/g) || []).length;
    if (sc > c) return ';';
    if (c > 0) return ',';

  function splitLine(line, delim) {
    var out = [], cur = '', q = false;
    for (var i = 0; i < line.length; i++) {
      var ch = line[i];
      if (q) {

  function parseTable(text) {

      ['no', /(号码|球衣|背号|编号|jersey|number|no\.)/i],
      ['pos', /(位置|场上|position|role|司职)/i],

  function importRows(state, table, mapping, opts) {
    opts = opts || {};
    if (!table || !table.rows) return { added: 0, skipped: 0, teams: 0 };
    var mode = opts.mode === 'replace' ? 'replace' : 'merge';
    if (mode === 'replace') resetCompetition(state, { keepDraw: false });
    if (!state.draw.done && state.swiss.rounds.length === 0) { /* nothing */ }
    var teamByName = {};
    state.teams.forEach(function (t) { teamByName[norm(t.name).toLowerCase()] = t; });
    var existing = {};
    state.players.forEach(function (p) { existing[p.teamId + '|' + norm(p.name)] = 1; });
    var added = 0, skipped = 0, newTeams = 0, carry = '';
    table.rows.forEach(function (row) {
      var cell = function (i) { return i >= 0 && i < row.length ? norm(row[i]) : ''; };
      var name = cell(mapping.name);
      if (!name || /^(姓名|名字|球员)$/.test(name)) return;
      var teamName = mapping.team >= 0 ? cell(mapping.team) : '';
      if (teamName) carry = teamName; else teamName = carry || '未分队';
      var k = teamName.toLowerCase();
      var team = teamByName[k];
      if (!team) {
        team = addTeam(state, teamName, { silent: true });
        teamByName[k] = team;
        newTeams++;
      }
      var pk = team.id + '|' + name;
      if (existing[pk]) { skipped++; return; }
      existing[pk] = 1;
      state.players.push({
        id: uid('p'), teamId: team.id, name: name,
        no: cell(mapping.no), pos: cell(mapping.pos), phone: cell(mapping.phone)
      });
      added++;
    });
    return { added: added, skipped: skipped, teams: newTeams };
  }

  function addTeam(state, name, opts) {
    opts = opts || {};
    var n = norm(name);
    if (!n) return null;
    var dup = state.teams.filter(function (t) { return norm(t.name).toLowerCase() === n.toLowerCase(); })[0];
    if (dup) return dup;
    var t = {
      id: uid('t'), name: n, short: shortName(n),
      color: COLORS[state.teams.length % COLORS.length],
      seed: state.teams.length + 1
    };
    state.teams.push(t);
    if (!opts.silent) touchRoster(state);
    return t;
  }

  function addPlayer(state, data) {
    var name = norm(data.name);
    if (!name) return { ok: false, error: '请填写球员姓名' };
    var team = null;
    if (data.teamId) team = state.teams.filter(function (t) { return t.id === data.teamId; })[0];
    if (!team) team = addTeam(state, data.teamName || '未分队');
    if (!team) return { ok: false, error: '请填写队伍名称' };
    if (state.players.some(function (p) { return p.teamId === team.id && norm(p.name) === name; })) {
      return { ok: false, error: '该队已有同名球员' };
    }
    var p = { id: uid('p'), teamId: team.id, name: name, no: norm(data.no), pos: norm(data.pos), phone: norm(data.phone) };
    state.players.push(p);
    touchRoster(state);
    return { ok: true, player: p, team: team };
  }

  function updatePlayer(state, id, data) {
    var p = state.players.filter(function (x) { return x.id === id; })[0];
    if (!p) return { ok: false, error: '球员不存在' };
    if (data.name != null) p.name = norm(data.name) || p.name;
    if (data.no != null) p.no = norm(data.no);
    if (data.pos != null) p.pos = norm(data.pos);
    if (data.phone != null) p.phone = norm(data.phone);
    if (data.teamId) {
      var tt = state.teams.filter(function (x) { return x.id === data.teamId; })[0];
      if (tt) p.teamId = tt.id;
    } else if (data.teamName) {
      var t = state.teams.filter(function (x) { return norm(x.name).toLowerCase() === norm(data.teamName).toLowerCase(); })[0] || addTeam(state, data.teamName);
      p.teamId = t.id;
    }
    return { ok: true };
  }

  function removePlayer(state, id) {
    state.players = state.players.filter(function (p) { return p.id !== id; });
  }

  function updateTeam(state, id, data) {
    var t = state.teams.filter(function (x) { return x.id === id; })[0];
    if (!t) return { ok: false, error: '队伍不存在' };
    if (data.name != null) {
      var n = norm(data.name);
      if (!n) return { ok: false, error: '队名不能为空' };
      if (state.teams.some(function (x) { return x.id !== id && norm(x.name).toLowerCase() === n.toLowerCase(); })) {
        return { ok: false, error: '队名重复' };
      }
      t.name = n;
      t.short = data.short != null ? norm(data.short) : shortName(n);
    }
    if (data.short != null) t.short = norm(data.short);
    return { ok: true };
  }

  function removeTeam(state, id) {
    state.teams = state.teams.filter(function (t) { return t.id !== id; });
    state.players = state.players.filter(function (p) { return p.teamId !== id; });
    var changed = state.draw.done || state.swiss.rounds.length || state.ko.built;
    if (changed) resetCompetition(state);
    state.teams.forEach(function (t, i) { t.seed = i + 1; });
  }

  function touchRoster(state) {
    if (!state.draw.done) return;
    var ids = state.teams.map(function (t) { return t.id; });
    state.draw.order = state.draw.order.filter(function (id) { return ids.indexOf(id) >= 0; });
    ids.forEach(function (id) { if (state.draw.order.indexOf(id) < 0) state.draw.order.push(id); });
  }

  /* ---------------- 队伍名单解析（纯队伍） ---------------- */

  var TEAM_HEADER = /^(序号|编号|排名|队伍名称|参赛队伍|参赛队|队伍|队名|球队|名称|no\.?|#|index|rank|team|club|name)$/i;

  function parseTeamList(text) {
    var lines = String(text || '').replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n').split('\n');
    var names = [], seen = {}, dup = 0;
    lines.forEach(function (line) {
      var raw = line.trim();
      if (!raw) return;
      if (/^```/.test(raw)) return;
      if (/^[-*_]{3,}$/.test(raw)) return;
      var cells;
      if (raw.indexOf('|') >= 0) {
        cells = raw.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|').map(norm);
        if (cells.every(function (c) { return c === '' || /^:?-{2,}:?$/.test(c); })) return;
      } else if (raw.indexOf('\t') >= 0) {
        cells = raw.split('\t').map(norm);
      } else if (raw.indexOf(',') >= 0) {
        cells = raw.split(',').map(norm);
      } else {
        cells = [raw];
      }
      while (cells.length > 1 && cells[cells.length - 1] === '') cells.pop();
      var name = '';
      if (cells.length === 1) {
        var one = cells[0];
        if (/^(序号|编号|排名)\s/.test(one)) return;
        if (TEAM_HEADER.test(one)) return;
        var m = one.match(/^(?:#|no\.?\s*)?\d{1,3}\s*[.、:：)）]\s*(.+)$/i) ||
                one.match(/^(?:#|no\.?\s*)?\d{1,3}\s+(.+)$/i);
        name = m ? m[1] : one;
      } else {
        var a = cells[0], b = cells[1];
        if (TEAM_HEADER.test(a) && TEAM_HEADER.test(b)) return;
        if (TEAM_HEADER.test(a) && b === '') return;
        if (/^\d{1,3}$/.test(a)) name = b;
        else if (/^\d{1,3}$/.test(b)) name = a;
        else name = a;
      }
      name = norm(name).replace(/^["'`]+|["'`]+$/g, '').trim();
      if (!name || TEAM_HEADER.test(name)) return;
      if (name.length > 40) name = name.slice(0, 40);
      var k = name.toLowerCase();
      if (seen[k]) { dup++; return; }
      seen[k] = 1;
      names.push(name);
    });
    return { names: names, duplicates: dup };
  }

  function importTeams(state, names, opts) {
    opts = opts || {};
    if (opts.mode === 'replace') {
      state.teams = [];
      state.players = [];
      resetCompetition(state, { keepDraw: false });
    }
    var added = 0, skipped = 0;
    (names || []).forEach(function (n) {
      var before = state.teams.length;
      var t = addTeam(state, n);
      if (t && state.teams.length > before) added++;
      else skipped++;
    });
    return { added: added, skipped: skipped };
  }

  function teamsCSV(state) {
    var rows = [['序号', '队伍名称']];
    state.teams.forEach(function (t, i) { rows.push([i + 1, t.name]); });
    return toCSV(rows);
  }

  /* ---------------- 抽签 ---------------- */

  function drawTeams(state, seed) {
    if (!state.teams.length) return { ok: false, error: '还没有队伍，先导入名单' };
    if (state.swiss.rounds.length || state.ko.built) return { ok: false, error: '比赛已经开始，需先重置赛程才能重新抽签' };
    var order = state.teams.map(function (t) { return t.id; });
    var rng = mulberry32(seed == null ? (Date.now() >>> 0) : seed);
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var tmp = order[i]; order[i] = order[j]; order[j] = tmp;
    }
    state.draw = { done: true, order: order, at: nowISO() };
    return { ok: true, order: order };
  }

  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------------- 积分榜 ---------------- */

  function computeStandings(state) {
    var P = state.meta;
    var rows = {};
    state.teams.forEach(function (t, i) {
      rows[t.id] = {
        teamId: t.id, name: t.name, short: t.short, color: t.color, seed: t.seed || i + 1,
        played: 0, won: 0, drawn: 0, lost: 0, gf: 0, ga: 0, gd: 0, points: 0, buchholz: 0, byes: 0, opps: []
      };
    });
    (state.swiss.rounds || []).forEach(function (r) {
      r.matches.forEach(function (m) {
        if (!m.played) return;
        var a = rows[m.homeId];
        if (!a) return;
        if (m.bye) {
          a.played++; a.won++; a.byes++; a.points += P.pointsWin;
          return;
        }
        var b = rows[m.awayId];
        if (!b) return;
        var hs = int(m.homeScore), as = int(m.awayScore);
        a.played++; b.played++;
        a.gf += hs; a.ga += as; b.gf += as; b.ga += hs;
        a.opps.push(m.awayId); b.opps.push(m.homeId);
        if (hs > as) { a.won++; b.lost++; a.points += P.pointsWin; }
        else if (hs < as) { b.won++; a.lost++; b.points += P.pointsWin; }
        else { a.drawn++; b.drawn++; a.points += P.pointsDraw; b.points += P.pointsDraw; }
      });
    });
    var list = Object.keys(rows).map(function (k) { return rows[k]; });
    list.forEach(function (r) {
      r.gd = r.gf - r.ga;
      var s = 0;
      r.opps.forEach(function (oid) { if (rows[oid]) s += rows[oid].points; });
      r.buchholz = s + r.byes; // 轮空按一个 1 分的虚拟对手计入对手分
    });
    list.sort(function (a, b) {
      return (b.points - a.points) || (b.gd - a.gd) || (b.gf - a.gf) ||
        (b.buchholz - a.buchholz) || (a.seed - b.seed) || String(a.name).localeCompare(String(b.name), 'zh-Hans-CN');
    });
    list.forEach(function (r, i) { r.rank = i + 1; });
    return list;
  }

  /* ---------------- 瑞士轮 ---------------- */

  function playedPairSet(state) {
    var s = {};
    (state.swiss.rounds || []).forEach(function (r) {
      r.matches.forEach(function (m) {
        if (m.bye || !m.awayId) return;
        s[keyOf(m.homeId, m.awayId)] = 1;
      });
    });
    return s;
  }

  function findPairing(teams, played, allowRematch) {
    var n = teams.length, used = [], pairs = [];
    var i;
    for (i = 0; i < n; i++) used.push(false);
    function rec() {
      var a = -1;
      for (var x = 0; x < n; x++) if (!used[x]) { a = x; break; }
      if (a < 0) return true;
      used[a] = true;
      for (var b = a + 1; b < n; b++) {
        if (used[b]) continue;
        if (!allowRematch && played[keyOf(teams[a].id, teams[b].id)]) continue;
        used[b] = true; pairs.push([a, b]);
        if (rec()) return true;
        pairs.pop(); used[b] = false;
      }
      used[a] = false;
      return false;
    }
    return rec() ? pairs : null;
  }

  function lotteryOrder(rows, seed) {
    var rng = mulberry32(seed == null ? (Date.now() >>> 0) : seed);
    var groups = [];
    rows.forEach(function (r) {
      var g = groups[groups.length - 1];
      if (!g || g.points !== r.points) {
        g = { points: r.points, list: [] };
        groups.push(g);
      }
      g.list.push(r);
    });
    var out = [];
    groups.forEach(function (g) { out = out.concat(shuffleInPlace(g.list.slice(), rng)); });
    return out;
  }

  function generateSwissRound(state, opts) {
    opts = opts || {};
    var n = state.swiss.rounds.length + 1;
    var max = state.meta.swissRounds || 4;
    if (n > max) return { ok: false, error: '已经完成全部 ' + max + ' 轮瑞士轮' };
    if (n > 1) {
      var prev = state.swiss.rounds[n - 2];
      if (prev.matches.some(function (m) { return !m.played; })) {
        return { ok: false, error: '第 ' + (n - 1) + ' 轮还有比赛未录入比分' };
      }
    }
    var tmap = {};
    state.teams.forEach(function (t) { tmap[t.id] = t; });
    var order = [];
    if (n === 1) {
      if (state.draw.done) {
        state.draw.order.forEach(function (id) { if (tmap[id]) order.push(tmap[id]); });
        state.teams.forEach(function (t) { if (order.indexOf(t) < 0) order.push(t); });
      } else {
        order = state.teams.slice();
      }
    } else {
      var rows = computeStandings(state);
      if (opts.lottery) rows = lotteryOrder(rows, opts.seed);
      order = rows.map(function (r) { return tmap[r.teamId]; }).filter(Boolean);
    }
    if (order.length < 2) return { ok: false, error: '至少需要 2 支队伍' };

    var played = playedPairSet(state);
    var byeTeam = null;
    if (order.length % 2 === 1) {
      var hadBye = {};
      state.swiss.rounds.forEach(function (r) { r.matches.forEach(function (m) { if (m.bye) hadBye[m.homeId] = 1; }); });
      var cands = order.filter(function (t) { return !hadBye[t.id]; });
      byeTeam = (cands.length ? cands[cands.length - 1] : order[order.length - 1]);
      order = order.filter(function (t) { return t.id !== byeTeam.id; });
    }
    var pairs = findPairing(order, played, false) || findPairing(order, played, true);
    if (!pairs) {
      pairs = [];
      for (var i = 0; i < order.length; i += 2) pairs.push([i, i + 1]);
    }
    var matches = pairs.map(function (p) {
      return {
        id: uid('m'), homeId: order[p[0]].id, awayId: order[p[1]].id,
        homeScore: null, awayScore: null, played: false, bye: false
      };
    });
    if (byeTeam) {
      matches.push({ id: uid('m'), homeId: byeTeam.id, awayId: null, homeScore: null, awayScore: null, played: true, bye: true });
    }
    var round = { no: n, matches: matches };
    state.swiss.rounds.push(round);
    state.swiss.current = n;
    return { ok: true, round: round, bye: byeTeam ? byeTeam.id : null };
  }

  function findSwissMatch(state, id) {
    for (var i = 0; i < state.swiss.rounds.length; i++) {
      var ms = state.swiss.rounds[i].matches;
      for (var j = 0; j < ms.length; j++) if (ms[j].id === id) return ms[j];
    }
    return null;
  }

  function setSwissScore(state, id, hs, as) {
    var m = findSwissMatch(state, id);
    if (!m) return { ok: false, error: '比赛不存在' };
    if (m.bye) return { ok: false, error: '轮空场次无需比分' };
    hs = int(hs); as = int(as);
    if (hs < 0 || as < 0 || hs > 99 || as > 99) return { ok: false, error: '比分需在 0–99 之间' };
    m.homeScore = hs; m.awayScore = as; m.played = true;
    return { ok: true };
  }

  function clearSwissScore(state, id) {
    var m = findSwissMatch(state, id);
    if (!m || m.bye) return;
    m.homeScore = null; m.awayScore = null; m.played = false;
  }

  /* ---------------- 淘汰赛 ---------------- */

  function effectiveAdvance(state) {
    var n = state.teams.length;
    var want = state.meta.advance || 8;
    var cap = 0;
    [32, 16, 8, 4, 2].forEach(function (x) { if (x <= n) cap = Math.max(cap, x); });
    if (!cap) return 0;
    return Math.min(want, cap);
  }

  function bracketOrder(n) {
    var order = [1, 2];
    while (order.length < n) {
      var m = order.length * 2 + 1;
      var next = [];
      order.forEach(function (s) { next.push(s); next.push(m - s); });
      order = next;
    }
    return order;
  }

  function koRoundName(size) {
    if (size === 2) return '决赛';
    if (size === 4) return '半决赛';
    if (size === 8) return '1/4 决赛';
    if (size === 16) return '1/8 决赛';
    if (size === 32) return '1/16 决赛';
    return size + ' 强';
  }

  function shuffleInPlace(arr, rng) {
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(rng() * (i + 1));
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function koSeeds(state) {
    var n = effectiveAdvance(state);
    return computeStandings(state).slice(0, n);
  }

  /**
   * 淘汰赛抽签
   * mode: seed  按积分固定（1v8、4v5、2v7、3v6）
   *       tier  分档抽签：前一半种子 vs 后一半，随机配对
   *       random 完全随机落位
   */
  function drawKnockout(state, mode, seed) {
    var seeded = koSeeds(state);
    var n = seeded.length;
    if (n < 2) return { ok: false, error: '晋级队伍不足' };
    mode = mode || 'seed';
    if (['seed', 'tier', 'random'].indexOf(mode) < 0) mode = 'seed';
    var rng = mulberry32(seed == null ? (Date.now() >>> 0) : seed);
    var ids = seeded.map(function (r) { return r.teamId; });
    var order;
    if (mode === 'tier') {
      var half = n / 2;
      var top = shuffleInPlace(ids.slice(0, half), rng);
      var bottom = shuffleInPlace(ids.slice(half), rng);
      order = [];
      for (var i = 0; i < half; i++) order.push(top[i], bottom[i]);
    } else if (mode === 'random') {
      order = shuffleInPlace(ids.slice(), rng);
    } else {
      order = bracketOrder(n).map(function (x) { return ids[x - 1]; });
    }
    return { ok: true, order: order, mode: mode };
  }

  function buildKnockout(state, opts) {
    opts = opts || {};
    var standings = computeStandings(state);
    var n = effectiveAdvance(state);
    if (n < 2) return { ok: false, error: '队伍数量不足，无法生成淘汰赛' };
    if (state.meta.swissRounds && state.swiss.rounds.length < state.meta.swissRounds) {
      return { ok: false, error: '瑞士轮还没打完（' + state.swiss.rounds.length + '/' + state.meta.swissRounds + '）' };
    }
    var seeded = standings.slice(0, n);
    var allowed = {};
    seeded.forEach(function (r) { allowed[r.teamId] = 1; });
    var mode = opts.mode || 'seed';
    var orderIds = null;
    if (opts.order && opts.order.length === n) {
      var seen = {};
      var valid = opts.order.every(function (id) {
        return allowed[id] && !seen[id] && (seen[id] = 1);
      });
      if (valid) orderIds = opts.order.slice();
    }
    if (!orderIds) {
      var draw = drawKnockout(state, mode);
      if (!draw.ok) return draw;
      orderIds = draw.order;
    }
    var rounds = [];
    var size = n;
    while (size >= 2) {
      var count = size / 2;
      var matches = [];
      for (var i = 0; i < count; i++) {
        matches.push({
          id: uid('k'),
          aId: size === n ? orderIds[i * 2] : null,
          bId: size === n ? orderIds[i * 2 + 1] : null,
          aScore: null, bScore: null, aPens: null, bPens: null,
          played: false, winnerId: null
        });
      }
      rounds.push({ name: koRoundName(size), size: size, matches: matches });
      size = size / 2;
    }
    state.ko = { built: true, rounds: rounds, champion: null, createdAt: nowISO(), mode: mode, order: orderIds };
    propagateKo(state);
    return { ok: true, mode: mode, order: orderIds };
  }

  function findKoMatch(state, id) {
    for (var i = 0; i < state.ko.rounds.length; i++) {
      var ms = state.ko.rounds[i].matches;
      for (var j = 0; j < ms.length; j++) if (ms[j].id === id) return ms[j];
    }
    return null;
  }

  function propagateKo(state) {
    if (!state.ko.built) return;
    var rounds = state.ko.rounds;
    for (var r = 1; r < rounds.length; r++) {
      var prev = rounds[r - 1].matches;
      rounds[r].matches.forEach(function (m, i) {
        var a = prev[i * 2], b = prev[i * 2 + 1];
        var aId = a && a.played ? a.winnerId : null;
        var bId = b && b.played ? b.winnerId : null;
        if (m.aId !== aId || m.bId !== bId) {
          m.aId = aId; m.bId = bId;
          m.aScore = null; m.bScore = null; m.aPens = null; m.bPens = null;
          m.played = false; m.winnerId = null;
        }
      });
    }
    var finals = rounds[rounds.length - 1].matches;
    state.ko.champion = finals[0] && finals[0].played ? finals[0].winnerId : null;
  }

  function setKoScore(state, id, as, bs, ap, bp) {
    var m = findKoMatch(state, id);
    if (!m) return { ok: false, error: '比赛不存在' };
    if (!m.aId || !m.bId) return { ok: false, error: '对阵还没产生' };
    as = int(as); bs = int(bs);
    if (as < 0 || bs < 0 || as > 99 || bs > 99) return { ok: false, error: '比分需在 0–99 之间' };
    ap = ap == null || ap === '' ? null : int(ap);
    bp = bp == null || bp === '' ? null : int(bp);
    var winner;
    if (as > bs) winner = m.aId;
    else if (as < bs) winner = m.bId;
    else {
      if (ap == null || bp == null) return { ok: false, error: '淘汰赛必须分出胜负，请填写点球比分' };
      if (ap === bp) return { ok: false, error: '点球比分不能相同' };
      winner = ap > bp ? m.aId : m.bId;
    }
    m.aScore = as; m.bScore = bs; m.aPens = ap; m.bPens = bp;
    m.played = true; m.winnerId = winner;
    propagateKo(state);
    return { ok: true, winner: winner };
  }

  function clearKoScore(state, id) {
    var m = findKoMatch(state, id);
    if (!m) return;
    m.aScore = null; m.bScore = null; m.aPens = null; m.bPens = null;
    m.played = false; m.winnerId = null;
    propagateKo(state);
  }

  /* ---------------- 重置 / 工具 ---------------- */

  function resetCompetition(state, opts) {
    opts = opts || {};
    state.swiss = { rounds: [], current: 0 };
    state.ko = { built: false, rounds: [], champion: null, createdAt: null };
    if (!opts.keepDraw) state.draw = { done: false, order: [], at: null };
  }

  function teamById(state, id) {
    return state.teams.filter(function (t) { return t.id === id; })[0] || null;
  }

  function playerCount(state, teamId) {
    return state.players.filter(function (p) { return p.teamId === teamId; }).length;
  }

  function stats(state) {
    var played = 0, goals = 0, upcoming = 0;
    (state.swiss.rounds || []).forEach(function (r) {
      r.matches.forEach(function (m) {
        if (m.bye) return;
        if (m.played) { played++; goals += num(m.homeScore) + num(m.awayScore); }
        else upcoming++;
      });
    });
    (state.ko.rounds || []).forEach(function (r) {
      r.matches.forEach(function (m) {
        if (m.aId && m.bId) {
          if (m.played) { played++; goals += num(m.aScore) + num(m.bScore); }
          else upcoming++;
        }
      });
    });
    return {
      teams: state.teams.length, players: state.players.length,
      played: played, goals: goals, upcoming: upcoming,
      avgGoals: played ? (goals / played) : 0
    };
  }

  function currentStage(state) {
    if (state.ko.champion) return 'champion';
    if (state.ko.built) return 'ko';
    if (state.swiss.rounds.length) return 'swiss';
    if (state.draw.done) return 'drawn';
    if (state.teams.length >= 2) return 'teams';
    if (state.players.length) return 'players';
    return 'empty';
  }

  /* ---------------- 导出 ---------------- */

  function csvCell(v) {
    var s = String(v == null ? '' : v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function toCSV(rows) { return rows.map(function (r) { return r.map(csvCell).join(','); }).join('\r\n'); }

  function rosterCSV(state) {
    var rows = [['队伍', '姓名', '号码', '位置', '电话']];
    state.players.forEach(function (p) {
      var t = teamById(state, p.teamId);
      rows.push([t ? t.name : '', p.name, p.no, p.pos, p.phone]);
    });
    return toCSV(rows);
  }

  function standingsCSV(state) {
    var rows = [['排名', '队伍', '赛', '胜', '平', '负', '进球', '失球', '净胜', '积分', '对手分']];
    computeStandings(state).forEach(function (r) {
      rows.push([r.rank, r.name, r.played, r.won, r.drawn, r.lost, r.gf, r.ga, r.gd, r.points, r.buchholz]);
    });
    return toCSV(rows);
  }

  function scheduleCSV(state) {
    var rows = [['阶段', '轮次', '主队', '客队', '比分']];
    state.swiss.rounds.forEach(function (r) {
      r.matches.forEach(function (m) {
        if (m.bye) { rows.push(['瑞士轮', '第 ' + r.no + ' 轮', teamById(state, m.homeId) ? teamById(state, m.homeId).name : '', '轮空', '']); return; }
        rows.push(['瑞士轮', '第 ' + r.no + ' 轮', nameOf(state, m.homeId), nameOf(state, m.awayId), m.played ? m.homeScore + ' : ' + m.awayScore : '']);
      });
    });
    state.ko.rounds.forEach(function (r) {
      r.matches.forEach(function (m) {
        if (!m.aId || !m.bId) return;
        var sc = m.played ? m.aScore + ' : ' + m.bScore + (m.aPens != null ? ' (点球 ' + m.aPens + ':' + m.bPens + ')' : '') : '';
        rows.push(['淘汰赛', r.name, nameOf(state, m.aId), nameOf(state, m.bId), sc]);
      });
    });
    return toCSV(rows);
  }

  function nameOf(state, id) {
    var t = teamById(state, id);
    return t ? t.name : 'TBD';
  }

  return {
    VERSION: VERSION,
    COLORS: COLORS,
    uid: uid,
    createState: createState,
    sanitizeState: sanitizeState,
    parseTable: parseTable,
    detectMapping: detectMapping,
    importRows: importRows,
    addTeam: addTeam,
    updateTeam: updateTeam,
    removeTeam: removeTeam,
    addPlayer: addPlayer,
    updatePlayer: updatePlayer,
    removePlayer: removePlayer,
    drawTeams: drawTeams,
    computeStandings: computeStandings,
    generateSwissRound: generateSwissRound,
    setSwissScore: setSwissScore,
    clearSwissScore: clearSwissScore,
    effectiveAdvance: effectiveAdvance,
    koSeeds: koSeeds,
    drawKnockout: drawKnockout,
    buildKnockout: buildKnockout,
    setKoScore: setKoScore,
    clearKoScore: clearKoScore,
    propagateKo: propagateKo,
    resetCompetition: resetCompetition,
    bracketOrder: bracketOrder,
    teamById: teamById,
    playerCount: playerCount,
    stats: stats,
    currentStage: currentStage,
    rosterCSV: rosterCSV,
    teamsCSV: teamsCSV,
    parseTeamList: parseTeamList,
    importTeams: importTeams,
    standingsCSV: standingsCSV,
    scheduleCSV: scheduleCSV,
    nameOf: nameOf
  };
});

<script>
/* 战报图渲染：积分榜 + 本轮比分 + 下一轮对阵，输出 1080px 宽 PNG */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.ShareCard = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  var W = 1080;
  var PAD = 56;
  var TEXT = '#e9f5ee';
  var MUTED = '#8aa79a';
  var MUTED2 = '#63806f';
  var GREEN = '#2ee66b';
  var GOLD = '#f5c451';
  var FONT = '"PingFang SC","Noto Sans CJK SC","Noto Sans SC","Source Han Sans SC","Microsoft YaHei","Droid Sans Fallback",sans-serif';

  function txt(ctx, s, x, y, size, weight, color, align) {
    ctx.font = (weight || 400) + ' ' + size + 'px ' + FONT;
    ctx.fillStyle = color || TEXT;
    ctx.textAlign = align || 'left';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(s == null ? '' : s), x, y);
  }

  function fit(ctx, s, maxW) {
    s = String(s == null ? '' : s);
    if (ctx.measureText(s).width <= maxW) return s;
    var lo = 0, hi = s.length;
    while (lo < hi) {
      var mid = Math.ceil((lo + hi) / 2);
      if (ctx.measureText(s.slice(0, mid) + '…').width <= maxW) lo = mid;
      else hi = mid - 1;
    }
    return s.slice(0, lo) + '…';
  }

  function rr(ctx, x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function card(ctx, x, y, w, h) {
    rr(ctx, x, y, w, h, 28);
    ctx.fillStyle = 'rgba(255,255,255,.035)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(46,230,107,.10)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  function standingsH(n, cut) {
    return 100 + n * 62 + (cut && n > cut ? 34 : 0) + 16;
  }
  function matchesH(n, big) {
    return 100 + n * (big ? 72 : 62) + 16;
  }

  function measure(d) {
    var h = 244;
    if (d.champion) h += 180 + 28;
    if (d.standings && d.standings.length) h += standingsH(d.standings.length, d.cut) + 28;
    if (d.results && d.results.matches.length) h += matchesH(d.results.matches.length, hasPens(d.results)) + 28;
    if (d.fixtures && d.fixtures.matches.length) h += matchesH(d.fixtures.matches.length, false) + 28;
    if (d.note) h += 96 + 28;
    h += 88;
    return Math.round(h);
  }

  function hasPens(res) {
    return res.matches.some(function (m) { return m.pens; });
  }

  function draw(canvas, d) {
    var H = measure(d);
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext('2d');
    if (!ctx) throw new Error('无法创建画布');

    var g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0e2119');
    g.addColorStop(.55, '#0a1712');
    g.addColorStop(1, '#070f0c');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var glow = ctx.createRadialGradient(W - 60, -120, 0, W - 60, -120, 760);
    glow.addColorStop(0, 'rgba(46,230,107,.20)');
    glow.addColorStop(1, 'rgba(46,230,107,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(0, 0, W, 640);

    var y = PAD;

    txt(ctx, (d.league || '况友杯') + (d.season ? ' · ' + d.season : ''), PAD, y + 14, 26, 700, GREEN);
    txt(ctx, d.updated || '', W - PAD, y + 14, 22, 500, MUTED2, 'right');
    y += 58;
    txt(ctx, d.headline || '', PAD, y + 34, 64, 800, TEXT);
    y += 84;
    txt(ctx, d.meta || '', PAD, y + 14, 25, 400, MUTED);
    y += 56;

    var x = PAD, cw = W - PAD * 2;

    if (d.champion) {
      var ch = 180;
      card(ctx, x, y, cw, ch);
      ctx.strokeStyle = 'rgba(245,196,81,.35)';
      rr(ctx, x, y, cw, ch, 28);
      ctx.stroke();
      txt(ctx, 'C H A M P I O N', x + 40, y + 44, 22, 700, GOLD);
      txt(ctx, fit(ctx, d.champion.name, cw - 80), x + 40, y + 96, 46, 800, d.champion.color || GOLD);
      txt(ctx, d.champion.line || '', x + 40, y + 142, 24, 500, MUTED);
      y += ch + 28;
    }

    if (d.standings && d.standings.length) {
      var n = d.standings.length;
      var cut = d.cut || 0;
      var h = standingsH(n, cut);
      card(ctx, x, y, cw, h);
      txt(ctx, '积分榜', x + 36, y + 44, 30, 700, TEXT);
      if (cut && n > cut) txt(ctx, '前 ' + cut + ' 名进淘汰赛', x + cw - 36, y + 44, 21, 500, MUTED, 'right');

      var right = x + cw - 36;
      var xPts = right;
      var xGd = right - 96;
      var xWdl = right - 214;
      var xPlayed = right - 330;
      var xTeam = x + 106;
      var teamMax = xPlayed - 62 - xTeam;

      txt(ctx, '赛', xPlayed, y + 78, 20, 600, MUTED2, 'right');
      txt(ctx, '胜/平/负', xWdl, y + 78, 20, 600, MUTED2, 'right');
      txt(ctx, '净', xGd, y + 78, 20, 600, MUTED2, 'right');
      txt(ctx, '分', xPts, y + 78, 20, 600, MUTED2, 'right');

      var y0 = y + 100;
      var gap = cut && n > cut ? 34 : 0;
      d.standings.forEach(function (r, i) {
        var top = y0 + i * 62 + (gap && i >= cut ? gap : 0);
        var cy = top + 31;
        if (cut && i < cut) {
          ctx.fillStyle = 'rgba(46,230,107,.045)';
          ctx.fillRect(x + 1, top, cw - 2, 62);
          ctx.fillStyle = 'rgba(46,230,107,.55)';
          ctx.fillRect(x + 16, top + 18, 3, 26);
        }
        var badgeColor = i === 0 ? GOLD : i === 1 ? '#cfd8dc' : i === 2 ? '#d08a52' : 'rgba(255,255,255,.07)';
        var badgeText = i < 3 ? '#10160d' : MUTED;
        ctx.fillStyle = badgeColor;
        rr(ctx, x + 36, cy - 16, 32, 32, 10);
        ctx.fill();
        txt(ctx, r.rank, x + 52, cy + 1, 19, 800, badgeText, 'center');

        ctx.fillStyle = r.color || GREEN;
        ctx.beginPath();
        ctx.arc(xTeam, cy, 6, 0, Math.PI * 2);
        ctx.fill();

        txt(ctx, fit(ctx, r.name, teamMax), xTeam + 18, cy, 28, 600, TEXT);
        txt(ctx, r.played, xPlayed, cy, 26, 500, MUTED, 'right');
        txt(ctx, r.w + '-' + r.d + '-' + r.l, xWdl, cy, 26, 500, MUTED, 'right');
        txt(ctx, (r.gd > 0 ? '+' : '') + r.gd, xGd, cy, 26, 500, r.gd > 0 ? TEXT : MUTED, 'right');
        txt(ctx, r.points, xPts, cy, 28, 800, TEXT, 'right');
      });

      if (gap) {
        var ly = y0 + cut * 62 + 17;
        ctx.save();
        ctx.setLineDash([8, 8]);
        ctx.strokeStyle = 'rgba(46,230,107,.35)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(x + 28, ly);
        ctx.lineTo(x + cw - 128, ly);
        ctx.stroke();
        ctx.restore();
        txt(ctx, '晋级线', x + cw - 36, ly, 18, 700, GREEN, 'right');
      }
      y += h + 28;
    }

    if (d.results && d.results.matches.length) {
      var big = hasPens(d.results);
      var rh = big ? 72 : 62;
      var hh = matchesH(d.results.matches.length, big);
      card(ctx, x, y, cw, hh);
      txt(ctx, d.results.title, x + 36, y + 44, 30, 700, TEXT);
      var cx = x + cw / 2;
      d.results.matches.forEach(function (m, i) {
        var cy = y + 100 + i * rh + rh / 2;
        var s = (m.hs == null ? '-' : m.hs) + ' : ' + (m.as == null ? '-' : m.as);
        var winH = m.hs != null && m.as != null && m.hs > m.as;
        var winA = m.hs != null && m.as != null && m.as > m.hs;
        txt(ctx, fit(ctx, m.home, 300), cx - 110, cy - (big ? 6 : 0), 27, 600, winH ? GREEN : TEXT, 'right');
        txt(ctx, fit(ctx, m.away, 300), cx + 110, cy - (big ? 6 : 0), 27, 600, winA ? GREEN : TEXT, 'left');
        ctx.font = '800 30px ' + FONT;
        ctx.fillStyle = '#0a1510';
        rr(ctx, cx - 58, cy - 24, 116, 48, 14);
        ctx.fill();
        txt(ctx, s, cx, cy + 1, 30, 800, TEXT, 'center');
        if (m.pens) txt(ctx, '点球 ' + m.pens, cx, cy + 22, 18, 500, MUTED2, 'center');
      });
      y += hh + 28;
    }

    if (d.fixtures && d.fixtures.matches.length) {
      var fh = matchesH(d.fixtures.matches.length, false);
      card(ctx, x, y, cw, fh);
      txt(ctx, d.fixtures.title, x + 36, y + 44, 30, 700, TEXT);
      var fx = x + cw / 2;
      d.fixtures.matches.forEach(function (m, i) {
        var cy = y + 100 + i * 62 + 31;
        txt(ctx, fit(ctx, m.home, 300), fx - 70, cy, 27, 600, TEXT, 'right');
        txt(ctx, 'VS', fx, cy, 22, 700, MUTED2, 'center');
        txt(ctx, fit(ctx, m.away, 300), fx + 70, cy, 27, 600, TEXT, 'left');
      });
      y += fh + 28;
    }

    if (d.note) {
      card(ctx, x, y, cw, 96);
      txt(ctx, d.note, x + cw / 2, y + 48, 26, 500, MUTED, 'center');
      y += 96 + 28;
    }

    txt(ctx, '更新于 ' + (d.updated || '') + ' · ' + (d.footer || '数据来自本机记录'), W / 2, H - 44, 21, 400, MUTED2, 'center');
    return { width: W, height: H };
  }

  return { draw: draw, measure: measure };
});
