<script>
/* 足球联赛 · 界面逻辑 */
(function () {
  'use strict';

  var E = window.Engine;
  var LS_KEY = 'football-league.v1';
  var THEME = ['#22c55e', '#38bdf8', '#f59e0b', '#ef4444', '#a855f7', '#14b8a6', '#f472b6', '#eab308', '#6366f1', '#84cc16', '#f97316', '#06b6d4'];

  var state = loadState();
  var storageOK = (function () {
    try {
      localStorage.setItem('__fl_probe', '1');
      localStorage.removeItem('__fl_probe');
      return true;
    } catch (err) { return false; }
  })();
  var ui = { tab: 'overview', swissRound: null, parsed: null, board: false, koMode: 'seed', swissMode: 'auto', share: null };
  var confirmResolve = null;
  var toastTimer = null;

  /* ================= 基础 ================= */

  function loadState() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (!raw) return E.createState();
      var st = E.sanitizeState(JSON.parse(raw));
      if (st.meta.name === '城市足球联赛') st.meta.name = '况友杯';
      return st;
    } catch (err) {
      console.warn('读取本地数据失败', err);
      return E.createState();
    }
  }

  function save() {
    if (!storageOK) return;
    try {
      localStorage.setItem(LS_KEY, JSON.stringify(state));
    } catch (err) {
      toast('本地保存失败：' + err.message, true);
    }
  }

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function $(id) { return document.getElementById(id); }

  function toast(msg, isErr) {
    var el = $('toast');
    if (!el) return;
    el.textContent = msg;
    el.className = 'toast show' + (isErr ? ' err' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.className = 'toast'; }, 2600);
  }

  function modal(html) {
    $('modal').innerHTML = '<div class="modal-mask" data-mask="1"><div class="modal-card">' + html + '</div></div>';
  }

  function closeModal() {
    if (ui.share && ui.share.url) {
      try { URL.revokeObjectURL(ui.share.url); } catch (err) { /* ignore */ }
    }
    ui.share = null;
    $('modal').innerHTML = '';
    ui.board = false;
  }

  function confirmBox(title, html, okText) {
    return new Promise(function (resolve) {
      confirmResolve = resolve;
      modal(
        '<div class="modal-head"><h2>' + esc(title) + '</h2></div>' +
        '<p class="hint">' + html + '</p>' +
        '<div class="row gap">' +
        '<button class="btn" style="flex:1" data-act="confirm-no">取消</button>' +
        '<button class="btn btn-danger" style="flex:1" data-act="confirm-yes">' + esc(okText || '确认') + '</button>' +
        '</div>'
      );
    });
  }

  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return '';
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' +
      String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  /* ================= 阶段 ================= */

  function stageCur() {
    var teams = state.teams.length;
    if (!teams) return 0;
    if (state.ko.champion) return 4;
    if (state.ko.built) return 3;
    if (state.swiss.rounds.length || state.draw.done) return 2;
    return 1;
  }

  function stagebarHTML() {
    var cur = stageCur();
    var html = '';
    for (var i = 0; i < 5; i++) {
      var cls = i < cur ? 'done' : (i === cur ? 'current' : '');
      if (cur === 4) cls = 'done';
      html += '<span class="seg ' + cls + '"></span>';
    }
    return html;
  }

  function subtitle() {
    if (!state.teams.length) return '报名 · 抽签 · 瑞士轮 · 淘汰赛';
    return state.teams.length + ' 支队伍 · ' + state.meta.swissRounds + ' 轮瑞士轮' +
      (state.meta.season ? ' · ' + state.meta.season : '');
  }

  /* ================= 总览 ================= */

  function heroInfo() {
    var teams = state.teams.length;
    if (teams < 2) {
      return {
        eyebrow: 'STEP 1 · 报名',
        title: teams ? '还差 ' + (2 - teams) + ' 支队伍就能开赛' : '先把参赛队伍登记进来',
        desc: '把报名名单粘贴进来：支持 Markdown 表格、「序号 队伍名称」两列、CSV，一行一支队；也可以手动添加。',
        btn: '导入队伍',
        act: 'open-import'
      };
    }
    if (!state.draw.done) {
      return { eyebrow: 'STEP 2 · 抽签', title: '名单齐了，抽签定签位', desc: teams + ' 支队伍随机排入 1–' + teams + ' 号签位。签位相邻的两支队伍组成瑞士轮第 1 轮对阵。', btn: '开始抽签', act: 'go-draw' };
    }
    if (!state.ko.built) {
      var rounds = state.swiss.rounds;
      if (!rounds.length) {
        return { eyebrow: 'STEP 3 · 瑞士轮', title: '签位已定，开踢第 1 轮', desc: '按积分分组配对，全程不重复对阵；每轮结束自动更新积分榜，共 ' + state.meta.swissRounds + ' 轮。', btn: '开始第 1 轮', act: 'gen-round' };
      }
      var last = rounds[rounds.length - 1];
      var pending = last.matches.filter(function (m) { return !m.played; }).length;
      if (pending) {
        return { eyebrow: '瑞士轮 · 第 ' + last.no + ' 轮', title: '还有 ' + pending + ' 场没录比分', desc: '录完第 ' + last.no + ' 轮全部比分，就能按积分生成下一轮对阵。', btn: '去录比分', act: 'tab', tab: 'swiss' };
      }
      if (rounds.length < state.meta.swissRounds) {
        return { eyebrow: '瑞士轮 · 第 ' + last.no + ' 轮结束', title: '本轮结束，生成下一轮', desc: '按当前积分重新分组，让战绩接近的队伍互相交手。', btn: '生成第 ' + (last.no + 1) + ' 轮', act: 'gen-round' };
      }
      var adv = E.effectiveAdvance(state);
      return { eyebrow: 'STEP 4 · 淘汰赛', title: '瑞士轮完成，准备淘汰赛', desc: '积分榜前 ' + adv + ' 名进入淘汰赛，按种子高低交叉对阵（1 对 ' + adv + '、4 对 ' + (adv - 3) + '…），单场决胜。', btn: '生成淘汰赛对阵', act: 'build-ko' };
    }
    if (state.ko.champion) {
      var champ = E.teamById(state, state.ko.champion);
      return { eyebrow: 'CHAMPION', title: (champ ? champ.name : '冠军') + ' 夺冠！', desc: '全部赛程结束。可以在「数据」里导出队伍名单、积分和完整赛程存档。', btn: '回看淘汰赛', act: 'tab', tab: 'ko' };
    }
    return { eyebrow: 'STEP 4 · 淘汰赛', title: '淘汰赛进行中', desc: '点对阵卡片录入比分；淘汰赛平局要补点球比分，点球更准的一方晋级。', btn: '继续比赛', act: 'tab', tab: 'ko' };
  }

  function activeRound() {
    if (state.ko.built && state.ko.rounds.length) {
      var kr = state.ko.rounds;
      for (var i = 0; i < kr.length; i++) {
        var need = kr[i].matches.some(function (m) { return m.aId && m.bId && !m.played; });
        if (need) return { kind: 'ko', round: kr[i], label: kr[i].name };
      }
      var fin = kr[kr.length - 1];
      return { kind: 'ko', round: fin, label: fin.name };
    }
    var rs = state.swiss.rounds;
    if (rs.length) return { kind: 'swiss', round: rs[rs.length - 1], label: '第 ' + rs[rs.length - 1].no + ' 轮' };
    return null;
  }

  function metric(v, label) {
    return '<div class="metric"><b>' + esc(v) + '</b><span>' + esc(label) + '</span></div>';
  }

  function quickMatchBar(ar, limit) {
    var html = '<div class="quick-list">';
    var shown = 0;
    ar.round.matches.forEach(function (m) {
      if (shown >= limit) return;
      var homeId = ar.kind === 'ko' ? m.aId : m.homeId;
      var awayId = ar.kind === 'ko' ? m.bId : m.awayId;
      if (!homeId) return;
      shown++;
      var hn = E.nameOf(state, homeId);
      var an = awayId ? E.nameOf(state, awayId) : '轮空';
      var score, pending = false;
      if (m.bye) { score = '轮空'; pending = true; }
      else if (m.played) score = m.homeScore + ' : ' + m.awayScore;
      else { score = 'VS'; pending = true; }
      if (ar.kind === 'ko' && m.played) score = m.aScore + ' : ' + m.bScore;
      html += '<div class="quick-match"><span class="t">' + esc(hn) + '</span>' +
        '<span class="s' + (pending ? ' pending' : '') + '">' + esc(score) + '</span>' +
        '<span class="t r">' + esc(an) + '</span></div>';
    });
    html += '</div>';
    return html;
  }

  function viewOverview() {
    var hero = heroInfo();
    var st = E.stats(state);
    var html = '<section class="hero">' +
      '<span class="eyebrow">' + esc(hero.eyebrow) + '</span>' +
      '<h2>' + esc(hero.title) + '</h2>' +
      '<p>' + esc(hero.desc) + '</p>' +
      '<button class="btn btn-primary" data-act="' + hero.act + '"' + (hero.tab ? ' data-tab="' + hero.tab + '"' : '') + '>' + esc(hero.btn) + '</button>' +
      '</section>';

    if (!state.teams.length) {
      html += '<p class="tiny" style="text-align:center;margin-top:10px"><a href="#" data-act="load-demo">没有数据？先载入 16 队示例看看效果</a></p>';
    }
    html += '<div class="metrics">' +
      metric(st.teams, '队伍') + metric(st.played, '已赛') +
      metric(st.avgGoals.toFixed(1), '场均进球') + metric(st.goals, '总进球') +
      '</div>';

    var ar = activeRound();
    if (ar) {
      html += '<div class="section"><div class="section-head"><h3>' + esc(ar.label) + ' 对阵</h3>' +
        '<button class="btn btn-sm" data-act="tab" data-tab="' + (ar.kind === 'ko' ? 'ko' : 'swiss') + '">全部 ›</button></div>' +
        quickMatchBar(ar, 4) + '</div>';
    } else if (!state.swiss.rounds.length) {
      html += '<div class="section"><div class="section-head"><h3>开赛三步</h3></div>' +
        '<div class="card" style="padding:2px 0">' +
        startRow('1', '导入队伍名单', state.teams.length ? '已登记 ' + state.teams.length + ' 支队伍' : '粘贴名单，一行一支队', state.teams.length ? 'done' : '') +
        startRow('2', '抽签定签位', state.draw.done ? '已生成签位' : '随机排位，决定首轮对阵', state.draw.done ? 'done' : '') +
        startRow('3', '开始瑞士轮', state.swiss.rounds.length ? '进行中' : '每轮按积分配对，不重复交手', state.swiss.rounds.length ? 'current' : '') +
        '</div></div>';
    }

    if (state.swiss.rounds.length) {
      var rows = E.computeStandings(state);
      html += '<div class="section"><div class="section-head"><h3>积分榜</h3>' +
        '<button class="btn btn-sm" data-act="tab" data-tab="swiss">完整 ›</button></div>' +
        standingsTable(rows, { limit: 5 }) + '</div>';
    }

    html += '<p class="foot">数据只保存在这台设备的浏览器里，换设备前请到「数据」导出备份。</p>';
    return html;
  }

  function startRow(no, title, sub, stateCls) {
    return '<div class="list-row">' +
      '<span class="ic" style="' + (stateCls === 'done' ? 'background:rgba(46,230,107,.16);color:#2ee66b' : '') + '">' + (stateCls === 'done' ? '✓' : no) + '</span>' +
      '<div class="tx"><b>' + esc(title) + '</b><span>' + esc(sub) + '</span></div>' +
      '</div>';
  }

  function rankBadge(rank) {
    var cls = rank === 1 ? 'top1' : rank === 2 ? 'top2' : rank === 3 ? 'top3' : '';
    return '<span class="rank-badge ' + cls + '">' + rank + '</span>';
  }

  function standingsTable(rows, opts) {
    opts = opts || {};
    var adv = E.effectiveAdvance(state);
    var list = opts.limit ? rows.slice(0, opts.limit) : rows;
    var html = '<div class="table-wrap"><table class="standings"><thead><tr>' +
      '<th>#</th><th>队伍</th><th>赛</th><th>胜/平/负</th><th>净</th><th>分</th>' +
      '</tr></thead><tbody>';
    list.forEach(function (r) {
      var cut = adv && rows.length > adv && r.rank === adv;
      html += '<tr class="' + (cut ? 'cut' : '') + '">' +
        '<td>' + rankBadge(r.rank) + '</td>' +
        '<td><div class="team-cell"><span class="dot" style="background:' + esc(r.color || '#2ee66b') + '"></span><span>' + esc(r.name) + '</span></div></td>' +
        '<td>' + r.played + '</td>' +
        '<td>' + r.won + '-' + r.drawn + '-' + r.lost + '</td>' +
        '<td>' + (r.gd > 0 ? '+' : '') + r.gd + '</td>' +
        '<td class="pts">' + r.points + '</td>' +
        '</tr>';
    });
    html += '</tbody></table></div>';
    if (adv && rows.length > adv) {
      html += '<p class="tiny muted" style="margin:7px 2px 0">虚线以上 ' + adv + ' 队晋级淘汰赛 · 同分按净胜球 → 进球 → 对手分排序</p>';
    } else {
      html += '<p class="tiny muted" style="margin:7px 2px 0">同分按净胜球 → 进球 → 对手分排序</p>';
    }
    return html;
  }

  /* ================= 名单 ================= */

  function viewTeams() {
    if (!state.teams.length) {
      return '<div class="empty"><span class="em">\ud83d\udee1\ufe0f</span><h3>还没有参赛队伍</h3>' +
        '<p>把报名名单直接粘贴进来：一行一支队伍，支持「01 云海生烟」两列、Markdown 表格或 CSV。</p>' +
        '<div class="row"><button class="btn btn-primary" data-act="open-import">导入队伍</button>' +
        '<button class="btn" data-act="add-team">手动添加</button></div>' +
        '<p class="tiny" style="margin-top:16px"><a href="#" data-act="load-demo">载入 16 队示例数据看看</a></p></div>';
    }
    var html = '<div class="row wrap gap" style="margin-top:2px">' +
      '<button class="btn btn-sm btn-primary" data-act="open-import">导入队伍</button>' +
      '<button class="btn btn-sm" data-act="add-team">+ 队伍</button>' +
      '<span class="spacer"></span>' +
      '<button class="btn btn-sm" data-act="export-teams">导出 CSV</button>' +
      '</div>' +
      '<input id="teamSearch" class="search" type="search" placeholder="搜索队伍" autocomplete="off">';

    var points = {};
    if (state.swiss.rounds.length) {
      E.computeStandings(state).forEach(function (r) { points[r.teamId] = r; });
    }
    html += '<div class="list-card" style="margin-top:12px">';
    state.teams.forEach(function (t, i) {
      var pt = points[t.id];
      html += '<button class="team-row" data-act="team-edit" data-id="' + t.id + '" data-search="' + esc((t.name + ' ' + (i + 1)).toLowerCase()) + '">' +
        '<span class="seed">' + String(i + 1).padStart(2, '0') + '</span>' +
        '<span class="dot" style="background:' + esc(t.color) + '"></span>' +
        '<span class="nm">' + esc(t.name) + '</span>' +
        (pt ? '<span class="pts-badge">' + pt.points + ' 分</span>' : '') +
        '<span class="chev">\u203a</span></button>';
    });
    html += '</div>';
    html += '<p class="hint" style="margin-top:12px">共 ' + state.teams.length + ' 支队伍 \u00b7 淘汰赛建议 4 / 8 / 16 支；点队伍可改名或删除。</p>';
    return html;
  }

  function filterTeams(q) {
    q = String(q || '').trim().toLowerCase();
    Array.prototype.forEach.call(document.querySelectorAll('.team-row'), function (row) {
      var hit = !q || (row.getAttribute('data-search') || '').indexOf(q) >= 0;
      row.classList.toggle('hidden', !hit);
    });
  }

  function viewDraw() {
    if (state.teams.length < 2) {
      return '<div class="empty"><span class="em">🎲</span><h3>队伍还不够</h3>' +
        '<p>至少需要 2 支队伍才能抽签，先去导入或添加队伍。</p>' +
        '<button class="btn btn-primary" data-act="tab" data-tab="teams">去导入队伍</button></div>';
    }
    var n = state.teams.length;
    if (!state.draw.done) {
      var html = '<div class="draw-stage"><span class="big-ball">🎲</span>' +
        '<h2>' + n + ' 支队伍等待抽签</h2>' +
        '<p>随机打乱顺序，生成 1–' + n + ' 号签位。签位相邻的两队组成第 1 轮对阵，之后按积分重新配对。</p>' +
        '<button class="btn btn-primary" data-act="do-draw">开始抽签</button></div>';
      html += '<div class="section"><div class="section-head"><h3>参赛队伍</h3><span class="sub">按报名顺序</span></div><div class="slots">';
      state.teams.forEach(function (t, i) {
        html += '<div class="slot"><span class="no">' + (i + 1) + '</span>' +
          '<span class="dot" style="background:' + esc(t.color) + '"></span>' +
          '<span class="nm">' + esc(t.name) + '</span>' +
          '<span class="vs-mark">' + (t.seed === 1 ? '1 号种子' : '种子 ' + t.seed) + '</span></div>';
      });
      html += '</div></div>';
      return html;
    }
    var ordered = state.draw.order.map(function (id) { return E.teamById(state, id); }).filter(Boolean);
    var started = state.swiss.rounds.length > 0;
    var html2 = '<div class="draw-stage" style="padding:18px 16px">' +
      '<span class="big-ball" style="animation:none;font-size:32px">✅</span>' +
      '<h2>抽签完成</h2>' +
      '<p>生成于 ' + esc(fmtDate(state.draw.at)) + ' · ' + ordered.length + ' 支队伍</p>' +
      '<div class="row" style="justify-content:center;margin-top:14px">' +
      '<button class="btn" data-act="redraw"' + (started ? ' disabled' : '') + '>重新抽签</button>' +
      '<button class="btn btn-primary" data-act="gen-round"' + (started ? ' style="display:none"' : '') + '>开始第 1 轮</button>' +
      (started ? '<button class="btn btn-primary" data-act="tab" data-tab="swiss">去瑞士轮</button>' : '') +
      '</div></div>';

    html2 += '<div class="section"><div class="section-head"><h3>签位</h3><span class="sub">1 对 2 · 3 对 4 · …</span></div><div class="slots">';
    for (var i = 0; i < ordered.length; i += 2) {
      html2 += '<div class="slot" style="margin-bottom:4px"><span class="no">' + (i + 1) + '</span>' +
        '<span class="dot" style="background:' + esc(ordered[i].color) + '"></span>' +
        '<span class="nm">' + esc(ordered[i].name) + '</span></div>';
      if (ordered[i + 1]) {
        html2 += '<div class="slot" style="margin-bottom:10px"><span class="no">' + (i + 2) + '</span>' +
          '<span class="dot" style="background:' + esc(ordered[i + 1].color) + '"></span>' +
          '<span class="nm">' + esc(ordered[i + 1].name) + '</span>' +
          '<span class="vs-mark">VS</span></div>';
      }
    }
    html2 += '</div></div>';
    return html2;
  }

  /* ================= 瑞士轮 ================= */

  function viewSwiss() {
    if (state.teams.length < 2) {
      return '<div class="empty"><span class="em">⚔️</span><h3>还没有队伍</h3><p>先导入队伍名单，抽签后开始瑞士轮。</p>' +
        '<button class="btn btn-primary" data-act="open-import">导入队伍</button></div>';
    }
    if (!state.draw.done) {
      return '<div class="empty"><span class="em">🎲</span><h3>先完成抽签</h3><p>签位决定第 1 轮的对阵顺序，抽签之后才能开始瑞士轮。</p>' +
        '<button class="btn btn-primary" data-act="go-draw">去抽签</button></div>';
    }
    var rounds = state.swiss.rounds;
    var max = state.meta.swissRounds;

    if (!rounds.length) {
      return '<div class="draw-stage"><span class="big-ball">⚔️</span>' +
        '<h2>瑞士轮 · 共 ' + max + ' 轮</h2>' +
        '<p>每轮按积分排序配对：战绩接近的队伍相遇，且全程不重复对阵。' +
        (state.teams.length % 2 ? '奇数支队伍，每轮会有一队轮空（记 3 分）。' : '') + '</p>' +
        '<button class="btn btn-primary" data-act="gen-round">开始第 1 轮</button></div>';
    }

    var activeNo = ui.swissRound || rounds[rounds.length - 1].no;
    var round = rounds.filter(function (r) { return r.no === activeNo; })[0] || rounds[rounds.length - 1];
    var allPlayed = round.matches.every(function (m) { return m.played; });
    var lastRound = rounds[rounds.length - 1];
    var lastAllPlayed = lastRound.matches.every(function (m) { return m.played; });

    var html = '<div class="round-chips">';
    rounds.forEach(function (r) {
      var done = r.matches.every(function (m) { return m.played; });
      html += '<button class="round-chip' + (r.no === round.no ? ' active' : '') + '" data-act="swiss-round" data-no="' + r.no + '">第 ' + r.no + ' 轮' + (done ? ' <span class="ok">✓</span>' : '') + '</button>';
    });
    if (rounds.length < max) html += '<button class="round-chip" data-act="gen-round">+ 下一轮</button>';
    html += '</div>';

    html += '<div class="matches">';
    round.matches.forEach(function (m, idx) {
      if (m.bye) {
        var bt = E.teamById(state, m.homeId);
        html += '<div class="match bye"><div class="match-meta"><span>第 ' + round.no + ' 轮 · 轮空</span><span>自动记 3 分</span></div>' +
          '<div class="side"><span class="dot" style="background:' + esc(bt ? bt.color : '#2ee66b') + '"></span>' +
          '<span class="nm">' + esc(bt ? bt.name : '轮空') + '</span><span class="badge green">+3</span></div></div>';
        return;
      }
      var H = E.teamById(state, m.homeId), A = E.teamById(state, m.awayId);
      var hs = m.homeScore, as = m.awayScore;
      var winH = m.played && hs > as, winA = m.played && as > hs;
      html += '<div class="match' + (m.played ? ' played' : '') + '" data-match="' + m.id + '">' +
        '<div class="match-meta"><span>第 ' + round.no + ' 轮 · 第 ' + (idx + 1) + ' 场</span>' +
        '<span>' + (m.played ? '<span class="badge green">已结束</span>' : '<span class="badge">未开始</span>') + '</span></div>' +
        '<div class="side' + (winH ? ' win' : '') + (m.played && !winH && hs < as ? ' lose' : '') + '">' +
        '<span class="dot" style="background:' + esc(H ? H.color : '#2ee66b') + '"></span>' +
        '<span class="nm">' + esc(H ? H.name : '待定') + '</span>' +
        '<input class="score" data-side="h" type="number" inputmode="numeric" min="0" max="99" placeholder="-" value="' + (m.homeScore == null ? '' : m.homeScore) + '"></div>' +
        '<div class="side' + (winA ? ' win' : '') + (m.played && !winA && as < hs ? ' lose' : '') + '">' +
        '<span class="dot" style="background:' + esc(A ? A.color : '#2ee66b') + '"></span>' +
        '<span class="nm">' + esc(A ? A.name : '待定') + '</span>' +
        '<input class="score" data-side="a" type="number" inputmode="numeric" min="0" max="99" placeholder="-" value="' + (m.awayScore == null ? '' : m.awayScore) + '"></div>' +
        '<div class="match-foot"><span class="hint">' + (m.played ? '要改比分直接改数字再保存' : '填好双方比分后保存') + '</span>' +
        '<button class="btn btn-sm' + (m.played ? '' : ' btn-primary') + '" data-act="swiss-save" data-id="' + m.id + '">保存</button></div>' +
        '</div>';
    });
    html += '</div>';

    if (lastAllPlayed && rounds.length < max) {
      var sm = ui.swissMode || 'auto';
      html += '<div class="section"><div class="row" style="justify-content:center;gap:6px;margin-bottom:10px">' +
        '<button class="round-chip' + (sm === 'auto' ? ' active' : '') + '" data-act="swiss-mode" data-mode="auto">自动配对</button>' +
        '<button class="round-chip' + (sm === 'lottery' ? ' active' : '') + '" data-act="swiss-mode" data-mode="lottery">抽签配对</button>' +
        '</div>' +
        '<button class="btn btn-primary btn-block" data-act="gen-round">' + (sm === 'lottery' ? '抽签生成第 ' : '生成第 ') + (rounds.length + 1) + ' 轮对阵</button>' +
        '<p class="hint" style="text-align:center;margin-top:8px">' +
        (sm === 'lottery' ? '同积分的队伍里抽签决定谁碰谁，仍然不重复对阵' : '按当前积分与排名自动配对，不重复对阵') +
        '</p></div>';
    }
    if (lastAllPlayed && rounds.length >= max && !state.ko.built) {
      html += '<div class="section"><button class="btn btn-primary btn-block" data-act="build-ko">瑞士轮结束，生成淘汰赛</button></div>';
    }
    if (!allPlayed && round.no === rounds.length) {
      html += '<p class="hint" style="text-align:center;margin-top:12px">录完本轮全部比分后，才能生成下一轮</p>';
    }

    var rows = E.computeStandings(state);
    html += '<div class="section"><div class="section-head"><h3>积分榜</h3>' +
      '<div class="row"><button class="btn btn-sm" data-act="share-card">分享图</button>' +
      '<button class="btn btn-sm" data-act="board">大屏比分板</button></div></div>' +
      standingsTable(rows, {}) + '</div>';
    return html;
  }

  /* ================= 淘汰赛 ================= */

  function viewKo() {
    if (!state.teams.length) {
      return '<div class="empty"><span class="em">🏆</span><h3>还没有队伍</h3><p>先完成报名、抽签和瑞士轮，再来打淘汰赛。</p>' +
        '<button class="btn btn-primary" data-act="open-import">导入队伍</button></div>';
    }
    if (!state.ko.built) {
      var swissDone = state.swiss.rounds.length >= state.meta.swissRounds &&

      var standings = E.computeStandings(state);
      var n = E.effectiveAdvance(state);
      var seeded = standings.slice(0, n);
      var mode = ui.koMode || 'seed';
      var html = '<div class="ko-empty"><span class="big-ball" style="animation:none;font-size:32px">🏆</span>' +
        '<h2 style="font-size:17px">淘汰赛 · 前 ' + n + ' 名晋级</h2>' +
        '<p class="hint" style="margin-top:6px">从积分榜取前 ' + n + ' 名，单场决胜，平局踢点球。对阵怎么定，你说了算。</p>' +
        '<div class="field" style="margin-top:14px"><label>对阵怎么定</label><div class="radio-row">' +
        koModeChip('seed', '按积分', mode) +
        koModeChip('tier', '分档抽签', mode) +
        koModeChip('random', '完全随机', mode) +
        '</div></div>' +
        '<p class="hint" style="margin-top:8px">' + koModeDesc(mode, n) + '</p>';

      if (mode === 'seed' && seeded.length && n >= 2) {
        var slotOrder = E.bracketOrder(n);
        html += '<div class="seed-pairs">';
        for (var i = 0; i < slotOrder.length; i += 2) {
          var sa = slotOrder[i], sb = slotOrder[i + 1];
          html += '<div class="seed-pair"><span class="badge">#' + sa + '</span>' +
            '<span style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(seeded[sa - 1].name) + '</span>' +
            '<span class="vs">VS</span>' +
            '<span style="flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(seeded[sb - 1].name) + '</span>' +
            '<span class="badge">#' + sb + '</span></div>';
        }
        html += '</div>';
      } else if (mode === 'tier' && seeded.length && n >= 2) {
        html += tierPreview(seeded, n);
      } else if (seeded.length) {
        html += '<div class="seed-pairs"><div class="seed-pair" style="align-items:flex-start"><span class="badge">随机</span>' +
          '<span style="flex:1;font-size:11.5px;line-height:1.7">' + seeded.map(function (r) { return esc(r.name); }).join(' · ') + '</span></div></div>';
      }

      var btnLabel = mode === 'seed' ? '生成淘汰赛对阵' : '开始抽签';
      html += '<button class="btn btn-primary btn-block" data-act="build-ko"' + (swissDone ? '' : ' disabled') + '>' + btnLabel + '</button>';
      if (!swissDone) html += '<p class="hint" style="text-align:center;margin-top:8px">瑞士轮还没打完（' + state.swiss.rounds.length + '/' + state.meta.swissRounds + ' 轮）</p>';
      html += '</div>';
      return html;
    }

    var ko = state.ko;
    var anyPlayed = ko.rounds.some(function (r) { return r.matches.some(function (m) { return m.played; }); });
    var html2 = '';
    if (ko.champion) {
      var ct = E.teamById(state, ko.champion);
      var fin = ko.rounds[ko.rounds.length - 1].matches[0];
      html2 += '<div class="champion"><span class="cup">🏆</span><span class="label">CHAMPION</span>' +
        '<h2 style="color:' + esc(ct ? ct.color : '#f5c451') + '">' + esc(ct ? ct.name : '冠军') + '</h2>' +
        '<p>决赛比分 ' + fin.aScore + ' : ' + fin.bScore + (fin.aPens != null ? '（点球 ' + fin.aPens + ':' + fin.bPens + '）' : '') + '</p></div>';
    }
    html2 += '<div class="section"><div class="section-head"><h3>对阵图 <span class="badge">' + koModeLabel(ko.mode) + '</span></h3>' +
      '<div class="row">' +
      (anyPlayed ? '' : '<button class="btn btn-sm" data-act="redraw-ko">重新抽签</button>') +
      '<button class="btn btn-sm" data-act="share-card">分享图</button>' +
      '<button class="btn btn-sm" data-act="board">大屏比分板</button></div></div>' +
      '<div class="bracket">';
    ko.rounds.forEach(function (r) {
      html2 += '<div class="bracket-col"><h4>' + esc(r.name) + '</h4><div class="col-body">';
      r.matches.forEach(function (m) {
        html2 += koMatchHTML(m, r.name);
      });
      html2 += '</div></div>';
    });
    html2 += '</div></div>';
    html2 += '<p class="hint" style="margin-top:4px">点对阵卡片录入或修改比分 · 淘汰赛平局必须补点球</p>';
    return html2;
  }

  function koModeChip(value, label, current) {
    return '<label class="radio-chip' + (current === value ? ' on' : '') + '">' +
      '<input type="radio" name="komode" value="' + value + '"' + (current === value ? ' checked' : '') + '>' + label + '</label>';
  }

  function koModeDesc(mode, n) {
    if (mode === 'tier') {
      return '前 ' + (n / 2) + ' 名一档、后 ' + (n / 2) + ' 名一档，抽签时每场一档对二档：瑞士轮成绩越好，越晚碰强队。';
    }
    if (mode === 'random') {
      return '不设种子保护，' + n + ' 支队伍全部随机落位，谁碰谁全看手气。';
    }
    return '按瑞士轮排名固定落位：1 对 ' + n + '、4 对 ' + (n - 3) + '…，靠前的种子分在不同半区。';
  }

  function koModeLabel(mode) {
    if (mode === 'tier') return '分档抽签';
    if (mode === 'random') return '完全随机';
    return '按积分排位';
  }

  function tierPreview(seeded, n) {
    var half = n / 2;
    var fmt = function (arr) {
      return arr.map(function (r) { return esc(r.name); }).join(' · ');
    };
    return '<div class="seed-pairs">' +
      '<div class="seed-pair" style="align-items:flex-start"><span class="badge green">一档</span>' +
      '<span style="flex:1;font-size:11.5px;line-height:1.7">' + fmt(seeded.slice(0, half)) + '</span></div>' +
      '<div class="seed-pair" style="align-items:flex-start"><span class="badge">二档</span>' +
      '<span style="flex:1;font-size:11.5px;line-height:1.7">' + fmt(seeded.slice(half)) + '</span></div></div>';
  }

  function koMatchHTML(m) {
    var A = m.aId ? E.teamById(state, m.aId) : null;
    var B = m.bId ? E.teamById(state, m.bId) : null;
    var played = m.played;
    var cls = played ? 'done' : (A && B ? 'live' : 'pending');
    var aWin = played && m.winnerId === m.aId;
    var bWin = played && m.winnerId === m.bId;
    var pens = m.aPens != null ? '<div class="ko-foot">点球 ' + m.aPens + ' : ' + m.bPens + '</div>' : '';
    return '<div class="ko-match ' + cls + '" data-act="ko-score" data-id="' + m.id + '">' +
      '<div class="ko-side ' + (aWin ? 'win' : '') + ' ' + (A ? '' : 'tbd') + '">' +
      '<span class="dot" style="background:' + esc(A ? A.color : '#33473c') + '"></span>' +
      '<span class="nm">' + (A ? esc(A.name) : '待定') + '</span>' +
      '<span class="sc">' + (played ? m.aScore : '') + '</span></div>' +
      '<div class="ko-side ' + (bWin ? 'win' : '') + ' ' + (B ? '' : 'tbd') + '">' +
      '<span class="dot" style="background:' + esc(B ? B.color : '#33473c') + '"></span>' +
      '<span class="nm">' + (B ? esc(B.name) : '待定') + '</span>' +
      '<span class="sc">' + (played ? m.bScore : '') + '</span></div>' + pens + '</div>';
  }

    modal(

      '<div class="match" style="border-color:rgba(46,230,107,.22)">' +
      '<div class="side"><span class="dot" style="background:' + esc(A.color) + '"></span>' +
      '<span class="nm">' + esc(A.name) + '</span>' +
      '<input class="score" id="koA" type="number" inputmode="numeric" min="0" max="99" value="' + (m.aScore == null ? '' : m.aScore) + '"></div>' +
      '<div class="side"><span class="dot" style="background:' + esc(B.color) + '"></span>' +
      '<span class="nm">' + esc(B.name) + '</span>' +
      '<input class="score" id="koB" type="number" inputmode="numeric" min="0" max="99" value="' + (m.bScore == null ? '' : m.bScore) + '"></div>' +
      '</div>' +

  function openBoard() {
    var ar = activeRound();
    if (!ar) return toast('还没有比赛', true);
    ui.board = true;
    var rows = '';
    var count = 0;
    ar.round.matches.forEach(function (m) {
      var homeId = ar.kind === 'ko' ? m.aId : m.homeId;
      var awayId = ar.kind === 'ko' ? m.bId : m.awayId;
      if (!homeId) return;
      count++;
      var hn = E.nameOf(state, homeId);
      var an = awayId ? E.nameOf(state, awayId) : '轮空';
      var hs = ar.kind === 'ko' ? m.aScore : m.homeScore;
      var as = ar.kind === 'ko' ? m.bScore : m.awayScore;
      var winH = m.played && hs > as, winA = m.played && as > hs;
      rows += '<div class="board-match">' +
        '<div class="bt ' + (winH ? 'win' : '') + '"><span class="nm">' + esc(hn) + '</span>' +
        '<span class="sc ' + (m.played ? '' : 'pending') + '">' + (m.played ? hs : (m.bye ? '轮空' : '–')) + '</span></div>' +
        '<div class="bt ' + (winA ? 'win' : '') + '"><span class="nm">' + esc(an) + '</span>' +
        '<span class="sc ' + (m.played ? '' : 'pending') + '">' + (m.played ? as : (m.bye ? '' : '–')) + '</span></div>' +
        '</div>';
    });
    $('modal').innerHTML = '<div class="board">' +
      '<div class="board-head"><div><h2>' + esc(state.meta.name) + '</h2>' +
      '<div class="sub">' + esc(ar.label) + ' · ' + count + ' 场</div></div>' +
      '<button class="btn btn-sm" data-act="board-close">关闭</button></div>' +
      '<div class="board-list">' + rows + '</div>' +
      '<div class="board-foot">比分直播板 · 数据来自本机记录</div></div>';
  }

  /* ================= 操作 ================= */

  function pad2(n) { return String(n).padStart(2, '0'); }

  function shareDate() {
    var d = new Date();
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function buildShareData() {
    var meta = state.meta;
    var cut = E.effectiveAdvance(state);
    var rows = E.computeStandings(state).map(function (r) {
      return { rank: r.rank, name: r.name, color: r.color, played: r.played, w: r.won, d: r.drawn, l: r.lost, gd: r.gd, points: r.points };
    });
    var d = {
      league: meta.name,
      season: meta.season,
      headline: '',
      meta: state.teams.length + ' 支队伍 · ' + meta.swissRounds + ' 轮瑞士轮 · 前 ' + cut + ' 进淘汰赛',
      updated: shareDate(),
      standings: rows,
      cut: state.ko.built ? 0 : (rows.length > cut ? cut : 0),
      results: null,
      fixtures: null,
      note: null,
      champion: null,
      fileTag: '战报'
    };

    if (state.ko.built) {
      var ko = state.ko;
      var playedRounds = ko.rounds.filter(function (r) {
        return r.matches.some(function (m) { return m.played; });
      });
      var last = playedRounds[playedRounds.length - 1];
      if (last) {
        d.results = {
          title: last.name + ' 比分',
          matches: last.matches.filter(function (m) { return m.played; }).map(function (m) {
            return {
              home: E.nameOf(state, m.aId), away: E.nameOf(state, m.bId),
              hs: m.aScore, as: m.bScore,
              pens: m.aPens != null ? (m.aPens + ':' + m.bPens) : null
            };
          })
        };
      }
      ko.rounds.forEach(function (r) {
        if (d.fixtures) return;
        var ms = r.matches.filter(function (m) { return m.aId && m.bId && !m.played; });
        if (ms.length) {
          d.fixtures = {
            title: r.name + ' 对阵',
            matches: ms.map(function (m) {
              return { home: E.nameOf(state, m.aId), away: E.nameOf(state, m.bId) };
            })
          };
        }
      });
      if (ko.champion) {
        var ct = E.teamById(state, ko.champion);
        var fin = ko.rounds[ko.rounds.length - 1].matches[0];
        d.headline = '冠军诞生';
        d.champion = {
          name: ct ? ct.name : '冠军',
          color: ct ? ct.color : '#f5c451',
          line: '决赛 ' + fin.aScore + ' : ' + fin.bScore + (fin.aPens != null ? '（点球 ' + fin.aPens + ':' + fin.bPens + '）' : '')
        };
        d.meta = meta.name + ' · 冠军 ' + (ct ? ct.name : '') + (meta.season ? ' · ' + meta.season : '');
        d.fileTag = '冠军';
        d.fixtures = null;
        d.note = null;
      } else {
        var cur = ko.rounds.filter(function (r) {
          return r.matches.some(function (m) { return m.aId && m.bId && !m.played; });
        })[0];
        d.headline = '淘汰赛 · ' + (cur ? cur.name : ko.rounds[ko.rounds.length - 1].name);
        d.fileTag = '淘汰赛';
        if (!d.fixtures) d.note = '本轮对阵待产生';
      }
    } else if (state.swiss.rounds.length) {
      var rounds = state.swiss.rounds;
      var played = rounds.filter(function (r) {
        return r.matches.some(function (m) { return m.played; });
      });
      var lastR = played[played.length - 1] || null;
      if (lastR) {
        d.results = {
          title: '第 ' + lastR.no + ' 轮 比分',
          matches: lastR.matches.filter(function (m) { return m.played; }).map(function (m) {
            return { home: E.nameOf(state, m.homeId), away: E.nameOf(state, m.awayId), hs: m.homeScore, as: m.awayScore };
          })
        };
        d.headline = '第 ' + lastR.no + ' 轮 战报';
        d.fileTag = '第' + lastR.no + '轮';
      } else {
        d.headline = '第 1 轮 对阵';
        d.fileTag = '第1轮';
      }

      var remaining = lastR && !lastR.matches.every(function (m) { return m.played; });
      if (remaining) {
        var left = lastR.matches.filter(function (m) { return !m.played && !m.bye; });
        if (left.length) {
          d.fixtures = {
            title: '第 ' + lastR.no + ' 轮 剩余对阵',
            matches: left.map(function (m) {
              return { home: E.nameOf(state, m.homeId), away: E.nameOf(state, m.awayId) };
            })
          };
        }
      } else {
        var nextRound = rounds.filter(function (r) { return lastR ? r.no === lastR.no + 1 : r.no === 1; })[0];
        if (nextRound) {
          var ms = nextRound.matches.filter(function (m) { return !m.played && !m.bye; });
          if (ms.length) {
            d.fixtures = {
              title: '第 ' + nextRound.no + ' 轮 对阵',
              matches: ms.map(function (m) {
                return { home: E.nameOf(state, m.homeId), away: E.nameOf(state, m.awayId) };
              })
            };
          }
        }
        if (!d.fixtures) {
          if (!lastR) d.note = '第 1 轮对阵待生成';
          else if (rounds.length < meta.swissRounds) d.note = '第 ' + (rounds.length + 1) + ' 轮对阵待抽签';
          else d.note = '瑞士轮结束 · 淘汰赛对阵待抽签';
        }
      }
    } else if (state.teams.length) {
      d.headline = '赛前 · 参赛队伍';
      d.meta = state.teams.length + ' 支队伍 · 抽签后开赛';
      d.note = '抽签完成后再生成首轮对阵';
      d.fileTag = '赛前';
    } else {
      d.headline = '赛前 · 等待报名';
      d.note = '还没有队伍';
    }
    return d;
  }

  function shareTextOf(d) {
    var lines = [];
    lines.push('【' + d.league + ' · ' + d.headline + '】');
    if (d.champion) lines.push('冠军：' + d.champion.name + '（' + d.champion.line + '）');
    if (d.standings && d.standings.length) {
      lines.push('');
      lines.push('积分榜');
      d.standings.forEach(function (r) {
        lines.push(r.rank + '. ' + r.name + '  ' + r.points + '分  ' + r.w + '-' + r.d + '-' + r.l + '  净' + (r.gd > 0 ? '+' : '') + r.gd);
      });
    }
    if (d.results) {
      lines.push('');
      lines.push(d.results.title);
      d.results.matches.forEach(function (m) {
        lines.push(m.home + ' ' + m.hs + ':' + m.as + ' ' + m.away + (m.pens ? '（点球 ' + m.pens + '）' : ''));
      });
    }
    if (d.fixtures) {
      lines.push('');
      lines.push(d.fixtures.title);
      d.fixtures.matches.forEach(function (m) { lines.push(m.home + ' vs ' + m.away); });
    }
    if (d.note) { lines.push(''); lines.push(d.note); }
    lines.push('');
    lines.push('更新于 ' + d.updated);
    return lines.join('\n');
  }

  function copyShareText() {
    if (!ui.share) return;
    var text = shareTextOf(ui.share.data);
    var done = function () { toast('文字版已复制，去 QQ 粘贴'); };
    var fallback = function () {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
      ta.remove();
      if (ok) done(); else toast('复制失败，请手动截图或保存图片', true);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, fallback);
    } else {
      fallback();
    }
  }

  function downloadShare() {
    if (!ui.share) return;
    var a = document.createElement('a');
    a.href = ui.share.url;
    a.download = ui.share.name;

  function shareNow() {

    try { can = !!(f && navigator.share && navigator.canShare && navigator.canShare({ files: [f] })); } catch (err) { can = false; }

      navigator.share({ files: [f], title: state.meta.name, text: ui.share.data.headline }).catch(function () {});

      '<p>正在为 ' + names.length + ' 支队伍随机排位</p></div>');

    var timer = setInterval(function () {
      var el = $('rolling');
      if (!el) return;
      el.textContent = names[Math.floor(Math.random() * names.length)];
      tick++;

      clearInterval(timer);
      E.drawTeams(state);
      save();
      closeModal();
      ui.tab = 'draw';

      '<div class="rolling" id="rolling">抽签中…</div>' +
      '<p>第 ' + (rounds.length + 1) + ' 轮 · 同积分队伍内抽取对手</p></div>');
    var timer = setInterval(function () {
      var el = $('rolling');
      if (!el) return;
      el.textContent = names[Math.floor(Math.random() * names.length)];

  function exportText(filename, text, mime) {
    try {
      var blob = new Blob(['\ufeff' + text], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1200);
      toast('已导出 ' + filename);
    } catch (err) {
      toast('导出失败：' + err.message, true);
    }
  }

  document.addEventListener('click', function (ev) {
    var mask = ev.target.closest && ev.target.closest('[data-mask]');
    if (mask && ev.target === mask) {
      var r = confirmResolve; confirmResolve = null;
      closeModal();
      if (r) r(false);
      return;
    }
    var el = ev.target.closest && ev.target.closest('[data-act]');
    if (!el) return;
    var act = el.getAttribute('data-act');
    if (!handlers[act]) return;
    if (el.tagName === 'A' || el.getAttribute('href') === '#') ev.preventDefault();
    handlers[act](el, ev);
  });

    if (t.id === 'fileCsv' && t.files && t.files[0]) {

      var reader = new FileReader();
      reader.onload = function () {
        var box = $('pasteBox');
        if (box) { box.value = String(reader.result || ''); doParse(); }
      };
      reader.readAsText(f);
      t.value = '';
    }
    if (t.id === 'fileJson' && t.files && t.files[0]) {
      var file = t.files[0];
      var fr = new FileReader();
      fr.onload = function () {
        try {
          var next = E.sanitizeState(JSON.parse(String(fr.result || '')));
          confirmBox('从备份恢复', '当前数据会被覆盖，确定继续？', '覆盖').then(function (ok) {
            if (!ok) return;
            state = next;
            ui.swissRound = null;
            ui.tab = 'overview';
            save(); render(); toast('备份已恢复');
          });
        } catch (err) {
          toast('备份文件无法解析：' + err.message, true);
        }
      };
      fr.readAsText(file);
      t.value = '';
    }
    if (t.name === 'imode') {
      Array.prototype.forEach.call(document.querySelectorAll('.radio-chip'), function (chip) {
        var input = chip.querySelector('input');
        chip.classList.toggle('on', !!(input && input.checked));
      });
    }
    if (t.name === 'komode') {
      ui.koMode = t.value;
      render();
    }
    if (t.id === 'pfTeam') {
      var wrap = $('newTeamWrap');
      if (wrap) wrap.style.display = t.value === '__new' ? 'block' : 'none';
    }
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') {
      if (ui.board) { closeModal(); render(); }
      else if ($('modal').innerHTML) closeModal();
      return;
    }
    if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('score')) {
      var box = ev.target.closest('.match');
      var btn = box && box.querySelector('[data-act="swiss-save"]');
      if (btn) { ev.preventDefault(); btn.click(); }
    }
  });

  /* ================= 启动 ================= */

  function render() {
    $('leagueName').textContent = state.meta.name;
    $('leagueSub').textContent = subtitle();
    $('stagebar').innerHTML = stagebarHTML();
    $('tabs').innerHTML = TABS.map(function (t) {
      return '<button class="tab' + (ui.tab === t[0] ? ' active' : '') + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join('');
    var views = {
      overview: viewOverview,
      teams: viewTeams,
      draw: viewDraw,
      swiss: viewSwiss,
      ko: viewKo,
      data: viewData
    };
    document.title = state.meta.name + ' · 赛程管理';
    var body = (views[ui.tab] || viewOverview)();
    if (!storageOK) {
      body = '<div class="warn-banner">当前浏览器不允许本地存储，刷新后数据会丢失。请用 Chrome 打开，或到「数据」里导出备份。</div>' + body;
    }
    $('view').innerHTML = body;
    if (ui.tab === 'teams') {
      var s = $('teamSearch');
      if (s && s.value) filterTeams(s.value);
    }
  }

  var TABS = [
    ['overview', '总览'],
    ['teams', '队伍'],
    ['draw', '抽签'],
    ['swiss', '瑞士轮'],
    ['ko', '淘汰赛'],
    ['data', '数据']
  ];

  window.__leagueApp = { render: render, state: function () { return state; }, shareData: buildShareData };
  render();
})();


</script>
</body>
</html>
